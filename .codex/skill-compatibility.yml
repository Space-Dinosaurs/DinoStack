      "expected_target": "exec_command + conditional session polling + write_stdin",
      "generated_token": "3. **On busy: do not read the owner file, do not classify it, and do not abort.** There is no separate unreadable-owner or stale-owner branch to evaluate here - both are progress conditions the helper itself handles, not give-up conditions for the conductor to decide. Start the helper with Codex `exec_command`; if `exec_command` yields a session ID, keep the conductor responsive and poll that session with `write_stdin` until completion; if it returns a terminal result, branch on that result immediately, letting it wait: `ds-wrap-acquire-lock \"$cwd\" --role=agent --session-id=\"$AE_SESSION_ID\"`. It polls in-process (jittered ~5s interval) and exits once the lock is acquired or after 20 minutes; non-blocking, so the conductor stays available until notified of completion. On the completion notification, branch on exactly three outcomes:\n   - **0** - acquired; the lock is now held by /ds-wrap. Proceed normally.\n   - **2** - timeout. Report the helper's final `timeout ...` line verbatim (it already carries role, pid, start time, and an `rm -rf` recovery command). Then abort.\n   - **1** - unexpected failure. Surface the WARNING line from stdout, then abort.\n   - **any other exit code** - surface it verbatim, then abort.\n\n   Exit codes 3 (unreadable owner) and 4 (stale-needs-manual) no longer exist, deliberately: an unreadable owner and an old-looking timestamp are progress conditions, not give-up conditions. A lock whose owner looks old may be held by a /ds-wrap that is legitimately still working - the timestamp alone cannot distinguish that from an abandoned lock, so the waiter keeps waiting and only tells the operator how to unwedge it manually (the HINT's `rm -rf` command) if the operator judges it stuck.\n",
      "kind": "operational",
