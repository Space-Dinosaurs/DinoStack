    {
      "expected_target": "cross-harness dispatch contract",
      "generated_token": "**Routing enforcement differs by harness.** Claude Code's `PreToolUse` hooks enforce its legacy Agent and Task behavior, but those hooks do not mediate Codex `spawn_agent`. On Codex, the conductor follows the binding prose contract and, for a role routed to another harness, executes discover -> dispatch -> status -> collect without silently falling back to a native spawn. See `$AE_REPO_DIR/content/references/cross-harness-teams.md` for the full decision rule, config schema, self-containment guard, dispatch table, and enforcement-status table.",
      "kind": "operational",
      "occurrence_hash": "5676e84e378aab2632ce6950ac89cb805ebfd3ca88a09ea3f31019d91993d058",
      "resolution_mode": "codex-spawn-contract",
      "scope": "codex-harness",
      "source": "assembled:METHODOLOGY.md",
      "source_token": "**Routing enforcement differs by harness.** Only Claude Code has a mechanical `PreToolUse` deny hook (`hooks/enforce-background-spawn.py`, wired by `.claude/install.sh`) that enforces background-by-default on legacy `Task` spawns and suppresses native `Task`/`Agent` spawns and `oh-my-claudecode:*` Skill calls while a cross-harness run's sentinel (`.agentic/teamrun/.active`) is live. A future enhancement will also proactively block a native spawn for a dispatchable role whose resolved `team.yml` harness is not `claude`, but that check is not yet merged. On every other harness (Codex, Gemini, Cursor, Kimi, Pi, omp, OpenClaw, OpenCode, Copilot, Hermes) this is a **binding prose contract, not a mechanically enforced hook** - the conductor on those harnesses must self-apply the discover -> dispatch -> status -> collect sequence and must not silently fall back to a native spawn just because no hook stops it. See `content/references/cross-harness-teams.md` for the full decision rule, config schema, self-containment guard, per-harness dispatch table, and the per-harness enforcement-status table."
    },
