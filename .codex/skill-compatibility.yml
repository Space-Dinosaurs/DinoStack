      "expected_target": "git worktree add + spawn_agent",
      "generated_token": "**Worktree isolation is MANDATORY.** Before every concurrent `engineer`, `qa-engineer`, and `release-orchestrator` spawn, execute the Codex spawn contract above. The main worktree is reserved for the conductor's branch and its untracked scaffolding (`$AE_PROJECT_DIR/.agentic/`, loop-state files - NOT in-flight planning artifacts, which are committed and pushed per `content/references/planning-artifacts.md` \u00a7Gate semantics as soon as they are authored, subject to the per-repo gitignore eligibility gate). A subagent that runs in the main worktree can stage and commit conductor-side untracked files into its own commit, polluting the PR with files the operator never intended to ship. This is a class of failure that does not surface as a test break - it surfaces as a reviewer asking \"why is `$AE_PROJECT_DIR/.agentic/loop-state.json` in this PR?\" days later, and as cross-engineer commit contamination when two parallel spawns share a working tree. Isolation is the primary mechanism that prevents both.",
