      "generated_token": "The project-local derived-rollup contract belongs to harnesses that implement the project-local context writer. The current Codex Stop hook instead writes only `~/.codex/projects/[hash]/context.md` and does not recompose `$AE_PROJECT_DIR/.agentic/context.md`. `$wrap` writes `$AE_PROJECT_DIR/.agentic/_wrap.md`; integrating that handoff into an automatic Codex project-local rollup is deferred to `context-writer-migration`.",
