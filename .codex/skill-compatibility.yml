      "expected_target": "~/.codex/projects/[hash]/context.md",
      "generated_token": "Why: the current Codex Stop hook writes continuity only to `~/.codex/projects/[hash]/context.md` and does not read or recompose project-local `$AE_PROJECT_DIR/.agentic/context.md`. `$wrap` owns its richer project-local `$AE_PROJECT_DIR/.agentic/_wrap.md` handoff under the wrap lock. Connecting that handoff to an automatic Codex project-local context writer remains deferred to `context-writer-migration`. Create `$AE_PROJECT_DIR/.agentic/` if it does not exist.",
