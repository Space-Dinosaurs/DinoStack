## Step 2: Reap worktrees

Resolve `bin/ds-cleanup-worktrees`: check `$REPO_DIR/bin/ds-cleanup-worktrees` first (the `REPO_DIR` env var, when the operator's shell happens to have it set), else fall back to PATH. This is NOT the same mechanism `hooks/session-start-wrap.sh` uses (it resolves `AE_REPO_DIR` via `resolve_ae_repo_dir_with_fallback`, sourced relative to that script's own on-disk location - a trick this inline Bash block, run ad hoc with no stable file location of its own, cannot reproduce) or `bin/ds-base-sync` (which resolves its colocated `$SCRIPT_DIR/ds-cleanup-worktrees` directly, with no PATH fallback at all). `REPO_DIR` is rarely set in an interactive or conductor shell, so this almost always lands on the PATH fallback - which is exactly why every adapter's install script wires `bin/` onto PATH. This single call replaces the entire manual classify (`classify_entry`) -> lock/dirty -> merge-evidence -> disposition (`disposition_for`) walk a hand-authored version of this step used to spell out here: same normative predicate, no second copy to drift.

**Base-branch resolution is no longer this command file's job (round-4 rework).** A prior version of this step hand-derived `--base` here via a grep/awk/sed text-extraction pipeline over `AGENTS.md`; that pipeline produced a fresh defect in three consecutive review rounds (a prose sentence that merely mentioned `BASE_BRANCH:` matching, mishandled quotes, a doubled `origin/` prefix, trailing whitespace surviving normalization, a fence-stripper that missed indented and `~~~` fences) - each fix was an input-variant patch on the last. `bin/ds-cleanup-worktrees` now resolves its own base automatically when `--base` is omitted: an `AGENTS.md` `BASE_BRANCH:` declaration (AUTHORITATIVE - if declared but its ref does not validate, resolution fails outright rather than falling through to a lower tier), then `git symbolic-ref refs/remotes/origin/HEAD`, then a local `develop` branch, then a local `development` branch, then `main` falling back to `master` - each of these lower tiers validated against origin before use, with a diagnostic and fallthrough to the next candidate on a resolved-but-nonexistent value. See `resolve_base_branch`'s docstring in `bin/ds-cleanup-worktrees` for the full tier order and its documented, deliberate deviations from `content/rules/conventions.md` §Base branch resolution. Simply omit `--base` below; do not re-derive it here. When resolution fails - either the AGENTS.md declaration was unresolvable, or every lower-tier automatic candidate failed validation - the binary names every candidate tried on stderr and exits 0 having removed nothing (fail-safe, not fatal - the same asymmetry the old inline pipeline had: a WARNING and a skipped reap for the session, never a hard nonzero exit that would abort Steps 3/4 below).

```bash
DS_CLEANUP_BIN=""
if [[ -n "${REPO_DIR:-}" ]] && [[ -x "$REPO_DIR/bin/ds-cleanup-worktrees" ]]; then
  DS_CLEANUP_BIN="$REPO_DIR/bin/ds-cleanup-worktrees"
elif command -v ds-cleanup-worktrees >/dev/null 2>&1; then
  DS_CLEANUP_BIN="$(command -v ds-cleanup-worktrees)"
fi

if [[ -n "$DS_CLEANUP_BIN" ]]; then
  # Default: actually remove, with a full per-entry breakdown. If the
  # operator asked for a preview/dry run instead ("show me what would be
  # removed", "don't delete anything yet"), add --dry-run - --explain
  # stays on either way so the report below has real detail to work from.
  # `--explain` alone does NOT imply `--dry-run`: without --dry-run this
  # invocation deletes. No --base flag: the binary resolves it itself (see
  # above) and prints which candidate it used.
  # --measure-size is ALWAYS passed here so the run reports what it
  # actually freed (reclaimed_kb live, would_reclaim_kb under --dry-run)
  # instead of leaving the removal permanently unmeasured; Step 4 reports
  # those figures. There is NO --no-measure-size flag - to opt out on a
  # very large checkout where the recursive `du` walk is too slow, drop
  # the flag from this one invocation and say so in the Step 4 report.
  "$DS_CLEANUP_BIN" --explain --measure-size
  DS_CLEANUP_STATUS=$?
  if [[ "$DS_CLEANUP_STATUS" -ne 0 ]]; then
    echo "ERROR: ds-cleanup-worktrees exited $DS_CLEANUP_STATUS - do NOT treat this as a completed reap. Stop and report the failure output above instead of proceeding to Steps 3/4 as though removal succeeded." >&2
    exit "$DS_CLEANUP_STATUS"
  fi
else
  echo "WARNING: ds-cleanup-worktrees not found (REPO_DIR/bin or PATH) - re-run your harness's DinoStack install script (<repo>/.claude/install.sh for Claude Code, the equivalent script under your adapter directory otherwise) to wire bin/ onto PATH. Worktree reap skipped this session." >&2
fi
```

This removes worktrees only - isolation (`.claude/worktrees/*`), feature/conductor-created (`.agentic/worktrees/*`), and registered-but-out-of-tree entries (`OUT_OF_TREE`), per `classify_entry`'s classification - never a branch. Branch deletion is Step 3's job, below, on its own separate proof: a bare `MERGE_EVIDENCE=merged`/PR-`MERGED` read is sufficient to reclaim a worktree (`git worktree remove` does not destroy commits) but is NOT sufficient evidence for `git branch -D` (DS-153 Amendment B1 - see the Notes section below). An `UNMANAGED` entry (a bare-repo entry, or a path under neither admin directory, e.g. `evals/.worktrees/wt-*`) is always reported, never touched; a registered worktree physically outside this repo's own directory tree is `OUT_OF_TREE`, not `UNMANAGED` - it is evaluated by the same evidence gates as ISOLATION/CONDUCTOR_CREATED and may be REMOVEd via ancestor-of-base evidence, origin-reachable evidence (DS-196), or `--archive-unproven` (which needs no merge evidence at all - see `content/references/worktree-lifecycle.md` for the full three-path disclosure). A genuinely foreign entry (a different repository's worktree) remains `UNMANAGED`. `--repo` must point at a repo's MAIN worktree, never one of its own linked worktrees - see the same reference doc.

**The default 24h age floor.** A worktree younger than `--min-age-hours` (default 24) resolves `SKIP_TOO_YOUNG`, never `REMOVE`, regardless of how otherwise-eligible it is - the binary itself now prints an unconditional `NOTE:` line naming the count whenever that bucket is nonzero, so a `removed=0` run is never left unexplained. Similarly, when at least half of a run's entries resolve `SKIP_UNPROVEN (SKIP_LS_REMOTE_ERROR)` (a `git ls-remote` failure reaching origin, not proof of an unmerged branch), the binary prints its own `NOTE:` line - check network/auth to origin before trusting a low `removed` count from that run. If the operator explicitly wants a specific, just-merged worktree gone right now, pass `--min-age-hours 0` for that invocation, but state the tradeoff when doing so: this narrows only one gate among several, so the worktree may still be skipped for another reason (dirty, locked, unproven branch, an unreadable activity timestamp, etc.), and it removes the protection against reaping a concurrent session's still-in-flight worktree (unlocked does not mean idle - a resumable session can leave its worktree unlocked between tool calls). Otherwise leave every flag but `--explain`/`--dry-run` at its default - `--base` is resolved automatically (see above) and is never operator-variable here; omit it, do not re-derive it.

