**Byte reporting: `--measure-size` (DS-216, OPT-IN, NEVER the default).** Every removal this tool has ever performed was permanently unmeasured - it deletes worktree directories without ever reporting what they occupied on disk, so "how much space did we recover?" had no answer. `--measure-size` closes that: it measures each REMOVE-bucket entry with `du -sk` BEFORE removal (there is nothing left to measure after) and reports `would_reclaim_kb` under `--dry-run` or `reclaimed_kb` on a live run - NEVER the same label in both, since a projection and bytes actually freed are different claims and conflating them is how "we recovered X" becomes a lie. With `--archive-unproven` also passed, this same figure WIDENS to also include every entry whose FINAL outcome is `ARCHIVED_AND_REMOVED` - an archived-and-removed worktree is removed exactly as permanently as a plain `REMOVE` one, so withholding its bytes would understate what the run actually freed (or, under `--dry-run`, what a real run would free). It also measures every `SKIP_DIRTY` entry into a separate `dirty_unreclaimable_kb` figure - dirty worktrees are refused removal terminally by design and are typically where the real byte mass on a checkout lives, so this total is surfaced but is NEVER folded into either reclaim total (reporting refused bytes as reclaimed would be exactly the lie this flag exists to prevent). Any entry a `du -sk` call cannot measure (failure or a generous 300s timeout - opt-in and operator-invoked, so a large tree is tolerated rather than raced) is EXCLUDED from every total, never defaulted to 0, and counted in `size_unknown_count`; a nonzero count means every total that run reports is a FLOOR, not an exact figure, and the binary prints a `NOTE:` saying so. Deliberately excludes any `reclaimable_by_gc_kb`/`git count-objects` figure - considered and rejected, since `size-garbage` counts only invalid/corrupt loose objects, never unreachable-but-valid objects from a deleted ref (measured `0 bytes` across six repos), so it cannot answer the question it appears to answer. Every byte figure measures the working-tree checkout only, never the shared git object store every worktree of a repo shares - removing a worktree never shrinks it, and deleting a branch reclaims nothing until `git gc` runs. Because measuring means a recursive `du` walk over potentially tens of GB, this flag is NEVER passed by any of the THREE real AUTOMATIC callers - `bin/ds-base-sync`'s advisory note, the SessionStart nudge, and `content/references/worktree-lifecycle.md`'s own session-start reap block (the mutating, backgrounded call site) - their cost profile must not change. **That carve-out covers only callers that fire without the operator asking.** This command's own Step 2 invocation ALWAYS passes `--measure-size`, and the two facts are consistent rather than in tension: the flag is opt-in and operator-invoked by design, so a large tree is tolerated rather than raced, and an operator who typed `/ds-cleanup-worktrees` is exactly the reader for whom "how much space did we recover?" must have an answer - a default run that answered it with silence was reproducing, at its own primary call site, the defect this flag exists to close. To opt out on a very large checkout where the `du` walk is too slow, drop the flag from that one invocation; there is no `--no-measure-size` flag, and a run made without the flag reports the byte figures as NOT MEASURED, never as zero. `--multi-repo --measure-size` (without `--report`) also prints a grand total across every swept repo, and the same FLOOR/object-store NOTEs when applicable. See `bin/ds-cleanup-worktrees`'s own `--measure-size` doc for the full field list under `--report --json`.

**Sweeping multiple repos: `--multi-repo`.** Plain `ds-cleanup-worktrees` operates on exactly one repo per invocation (`--repo <path>`, default cwd) - `--multi-repo` extends the SAME binary to sweep several repos in one call, in-process, sequentially (never parallel - legible output, no concurrent `git`/`gh` rate-limit contention across repos). It discovers a set of repos - explicit `--repo <path>` (now repeatable once `--multi-repo` is given), positional root-directory arguments (scanned to `--depth` levels, default 1, max 3, for a `.git` dir or file), or a `~/.agentic/cleanup-worktrees.json` fallback (`{"roots": [...], "repos": [...]}`), consulted only when neither an explicit `--repo` nor a positional root is given - `ds-cleanup-worktrees --init-config` scaffolds this file for a first-time setup (never overwrites an existing one; prints an empty `{"roots": [], "repos": []}` skeleton and instructions otherwise). `--max-repos N` caps the discovered-and-deduped target list to the first N (discovery order preserved, applied AFTER dedup and BEFORE any per-repo evaluation, so it bounds git-call cost, not just display) - unset is unbounded. It then evaluates and (unless `--report`) sweeps every discovered repo using the exact same predicate and every safety gate described above, per repo, with each repo resolving its OWN base independently (`--base` combined with `--multi-repo` is a usage error - a single global base would silently leak one repo's base into every other repo's evaluation). One repo's or root's failure (bad path, discovery error, nonzero evaluation) never halts the sweep - it is reported and the remaining repos/roots are still attempted; exit 1 when any repo/root errored, exit 2 on a usage error (including zero repos discovered). The standalone `bin/ds-reap-all` subprocess-per-repo wrapper this mode was ported from has been retired - `--multi-repo` is now the sole cross-repo sweep mechanism.

Use proactively when worktrees are accumulating or any time you want to confirm the repo is in a clean state. **Not immediate post-merge cleanup at the default settings:** Step 2's 24h age floor means a worktree from a PR merged minutes or hours ago is reported as `SKIP_TOO_YOUNG`, not removed - the floor is a genuine safety default (an unlocked worktree can still belong to a resumable session), not a bug. Step 2 below documents `--min-age-hours` narrowing, but narrowing this floor never guarantees removal: it is only one of several gates (a worktree may still be skipped for another reason - dirty, locked, unproven branch, an unreadable activity timestamp, etc.), and it removes the protection against reaping a concurrent session's still-in-flight worktree. Also invoke when the user says "prune worktrees", "clean up branches", "tidy the repo", or "remove stale worktrees". Works in any git repo.

## Execution model

Run all steps directly in the conductor session via Bash - do NOT spawn background agents. Worktree cleanup is sequential and fast.

