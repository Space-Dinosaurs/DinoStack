# /ds-cleanup-worktrees

> Run the Activation preflight from `METHODOLOGY.md` before proceeding. If inactive, no-op and exit.

Clean up stale git worktrees and local branches in the current repository. Covers both worktree removal and local branch prune - see `content/references/worktree-lifecycle.md` §Branch prune for the canonical branch-prune command block.

`bin/ds-cleanup-worktrees` is the executable, machine-invocable form of the classify -> lock/dirty -> merge-evidence -> disposition predicate this command runs in Step 2 below - it delegates classification to `classify_entry` and the LOCKED/DIRTY/branch-evidence decision to `disposition_for` itself (both `bin/tests/worktree_model.py`), the single normative definition of both, so it can no longer diverge from a hand-authored predicate the way a bespoke reimplementation could (a round-2 Skeptic Critical/Major review caught exactly that divergence in an earlier version of this command file and required this delegation). It additionally applies three safety floors a bare classify/disposition read does not: a self-worktree guard (never reaps the worktree the invoking process is running inside), an age floor (default 24h - a worktree can be unlocked yet still belong to a resumable session), and a gitignored-content guard - a worktree can report CLEAN under plain `git status --porcelain` while holding irreplaceable ignored content, e.g. `.agentic/plan.md`. By OPERATOR DECISION (round 3) this guard is a PROTECTED DENYLIST, not a fail-safe allowlist: `docs/planning/**`, `.env*`, and `*.local` block removal; everything else ignored - including generated adapter output (`.kimi/`, `.codex/`, `.claude/skills/`) - is disposable and does not block (a round-2 fail-safe allowlist shipped first and measured `removed=0` against the live checkout). `.agentic/**` is a special case with INVERTED polarity (round-4 correction): protected by default inside `.agentic/` - EXCEPT a small named disposable set (routine telemetry like `events.jsonl`, `wrap/`, `codex-prompt-generation/`, `hud/`, cache dirs). Round 3's blanket `.agentic/**` protection also measured `removed=0`, because this repo dogfoods its own methodology and every worktree that has ever hosted an agent accumulates routine telemetry; `.agentic/**` was only ever meant to protect AUTHORED work (plans, notes, decisions), not session logs. Before any worktree is actually removed, its `.agentic/events.jsonl` (if present) is salvaged into the primary repo's `.agentic/reaped-telemetry/` first and the copy is verified - a failed salvage blocks removal rather than becoming a silent deletion. `--strict-ignored` restores the round-2 allowlist behavior UNCHANGED (including for `.agentic/`, where it still blocks `events.jsonl` exactly like round 2) for an operator who wants the more conservative (and less effective) polarity instead. These floors (self-worktree, age, gitignored-content) can only make the tool remove FEWER worktrees than the bare `disposition_for` predicate alone would, never more. See `bin/ds-cleanup-worktrees`'s own module docstring for the full rationale, disposable-set definitions, and salvage mechanics. Both `ds-base-sync`'s advisory note and the SessionStart worktree-count nudge invoke it in `--count-only` mode (a raw count, zero network, zero per-entry evaluation - not a removal forecast).

**The `SKIP_UNPROVEN` class and `--archive-unproven` (round 5).** A worktree can pass every other gate (clean, unlocked, past the age floor, not self, not protected-content) and STILL never resolve, because its branch carries real, unmerged commits that were never pushed anywhere and have no matching PR - `disposition_for` correctly refuses to call that `ELIGIBLE` (the round-4 measurement against this repo's own live checkout found this to be the dominant remaining blocker once the `.agentic/` correction landed: `skipped-protected-content` dropped to 0, but `removed` stayed 0 because most of the remaining worktrees carry exactly this class of branch - default-named `worktree-agent-<id>` branches and legacy `ds-round8`..`ds-round12` rework branches). Left alone, `SKIP_UNPROVEN` worktrees accumulate indefinitely - nothing ever resolves them. `--archive-unproven` (OPT-IN, NEVER the default) extends this repo's own precedent for the identical problem on BRANCHES - `bin/ds-branch-prune` archived 75 unprovable branches into one verified `git bundle` before deleting them (DS-153, `.agentic/branch-archive/`) - to WORKTREES, but only to an explicit whitelist within `SKIP_UNPROVEN`, never the whole bucket (round 6 correction): only `SKIP_NOT_PUSHED` and `SKIP_AMBIGUOUS_NO_PR` qualify - `SKIP_PR_OPEN` (a hard safety override) and `SKIP_LS_REMOTE_ERROR` (a transient failure) are NEVER archived, even with the flag set. Separately, a PER-ENTRY `gh pr list` query failure (auth fine, that one call errored/timed out/rate-limited) is reported as its OWN `SKIP_PR_QUERY_ERROR` outcome - never `SKIP_UNPROVEN` at all - so it is never eligible for `--archive-unproven` in the first place, not merely excluded from the whitelist: a query failure is a distinct fact from "no PR exists" and must never be treated as proof of anything (round-7/8 correction; see `bin/ds-cleanup-worktrees`'s own module docstring, Removal predicate gate 9). It also refuses to run at all in degraded gh mode (`--no-gh`, or `gh` unavailable/unauthenticated) - without PR evidence it cannot distinguish a genuinely-unprovable branch from one behind an open PR. For every whitelisted entry, it archives the full branch into a verified `git bundle` under `.agentic/worktree-archive/` (never removing anything if the bundle create or verify fails), salvages telemetry (same guard as the plain removal path - a failed salvage also blocks removal), then removes the worktree and prints the exact restore command. It removes the worktree only, never the branch - branch deletion remains `bin/ds-branch-prune`'s job. `.agentic/worktree-archive/` is gitignored (same `/.agentic/*` umbrella as `.agentic/reaped-telemetry/`, no new carve-out) and grows unbounded - pruning it is the operator's own responsibility, exactly like `.agentic/branch-archive/`. See `bin/ds-cleanup-worktrees`'s own module docstring ("Archiving unproven branches") for the full mechanism.

**Which project is worst - `--report` (run this FIRST, before any multi-repo removal).** Worktrees accumulate across many project checkouts on one machine, and an operator with several of them has no single command telling them which project is the worst offender - `--dry-run` output is per-repo, so answering "which project should I clean first" meant running it once per checkout by hand and comparing by eye. `ds-cleanup-worktrees --multi-repo --report` answers that directly: it ranks every discovered repo, worst first. Two cost tiers, chosen by whether `--count-only` is ALSO given: `--report --count-only` (FAST/approximate - 2 git calls per repo, zero network; ranks by raw non-root worktree count, tie-broken by the oldest worktree's directory age) is a cheap first look, but a weak proxy - 30 legitimately-active worktrees are not the same as 30 stale ones, and the printed table says so. Plain `--report` (DEEP/accurate - a full per-entry evaluation per repo, same cost as `--dry-run --explain`, just never acting on it) ranks by the count of entries that would actually resolve `REMOVE`. Either tier accepts `--json` for machine-readable output (`[{"repo", "nonroot_worktrees", "oldest_age_hours", "eligible"}, ...]`). `--report` is STRUCTURALLY READ-ONLY - it never calls `git worktree remove`/`unlock`/`prune` under any combination of flags, including `--dry-run` (which is simply irrelevant to it) - and is incompatible with `--archive-unproven` for the same reason. Look before you delete: run `--report` (or its fast `--count-only` form for a quick first pass) before running the sweep below across several repos for the first time.

**Sweeping multiple repos: `--multi-repo`.** Plain `ds-cleanup-worktrees` operates on exactly one repo per invocation (`--repo <path>`, default cwd) - `--multi-repo` extends the SAME binary to sweep several repos in one call, in-process, sequentially (never parallel - legible output, no concurrent `git`/`gh` rate-limit contention across repos). It discovers a set of repos - explicit `--repo <path>` (now repeatable once `--multi-repo` is given), positional root-directory arguments (scanned to `--depth` levels, default 1, max 3, for a `.git` dir or file), or a `~/.agentic/cleanup-worktrees.json` fallback (`{"roots": [...], "repos": [...]}`), consulted only when neither an explicit `--repo` nor a positional root is given - then evaluates and (unless `--report`) sweeps every discovered repo using the exact same predicate and every safety gate described above, per repo, with each repo resolving its OWN base independently (`--base` combined with `--multi-repo` is a usage error - a single global base would silently leak one repo's base into every other repo's evaluation). One repo's or root's failure (bad path, discovery error, nonzero evaluation) never halts the sweep - it is reported and the remaining repos/roots are still attempted; exit 1 when any repo/root errored, exit 2 on a usage error (including zero repos discovered). `bin/ds-reap-all` is UNCHANGED by this - a separate cross-repo sweep wrapper that shells out to this binary once per repo instead - and remains available for now.

Use proactively when worktrees are accumulating or any time you want to confirm the repo is in a clean state. **Not immediate post-merge cleanup at the default settings:** Step 2's 24h age floor means a worktree from a PR merged minutes or hours ago is reported as `SKIP_TOO_YOUNG`, not removed - the floor is a genuine safety default (an unlocked worktree can still belong to a resumable session), not a bug, and Step 2 below documents the `--min-age-hours 0` escape for an operator who wants that specific worktree gone right now. Also invoke when the user says "prune worktrees", "clean up branches", "tidy the repo", or "remove stale worktrees". Works in any git repo.

## Execution model

Run all steps directly in the conductor session via Bash - do NOT spawn background agents. Worktree cleanup is sequential and fast.

---

## Step 1: Fetch and prune metadata

```bash
git fetch origin 2>/dev/null || true
git worktree prune
```

`git fetch origin` is non-fatal - repos without a remote (local test repos, offline environments) will fail here and that is fine. Always continue. `git worktree prune` removes entries pointing to directories that no longer exist on disk.

---

## Step 2: Reap worktrees

Resolve `bin/ds-cleanup-worktrees`: check `$REPO_DIR/bin/ds-cleanup-worktrees` first (the `REPO_DIR` env var, when the operator's shell happens to have it set), else fall back to PATH. This is NOT the same mechanism `hooks/session-start-wrap.sh` uses (it resolves `AE_REPO_DIR` via `resolve_ae_repo_dir_with_fallback`, sourced relative to that script's own on-disk location - a trick this inline Bash block, run ad hoc with no stable file location of its own, cannot reproduce) or `bin/ds-base-sync` (which resolves its colocated `$SCRIPT_DIR/ds-cleanup-worktrees` directly, with no PATH fallback at all). `REPO_DIR` is rarely set in an interactive or conductor shell, so this almost always lands on the PATH fallback - which is exactly why every adapter's install script wires `bin/` onto PATH. This single call replaces the entire manual classify (`classify_entry`) -> lock/dirty -> merge-evidence -> disposition (`disposition_for`) walk a hand-authored version of this step used to spell out here: same normative predicate, no second copy to drift.

**Base-branch resolution is no longer this command file's job (round-4 rework).** A prior version of this step hand-derived `--base` here via a grep/awk/sed text-extraction pipeline over `AGENTS.md`; that pipeline produced a fresh defect in three consecutive review rounds (a prose sentence that merely mentioned `BASE_BRANCH:` matching, mishandled quotes, a doubled `origin/` prefix, trailing whitespace surviving normalization, a fence-stripper that missed indented and `~~~` fences) - each fix was an input-variant patch on the last. `bin/ds-cleanup-worktrees` now resolves its own base automatically when `--base` is omitted: an `AGENTS.md` `BASE_BRANCH:` declaration (AUTHORITATIVE - if declared but its ref does not validate, resolution fails outright rather than falling through to a lower tier), then `git symbolic-ref refs/remotes/origin/HEAD`, then a local `develop` branch, then a local `development` branch, then `main` falling back to `master` - each of these lower tiers validated against origin before use, with a diagnostic and fallthrough to the next candidate on a resolved-but-nonexistent value. See `resolve_base_branch`'s docstring in `bin/ds-cleanup-worktrees` for the full tier order and its documented, deliberate deviations from `content/rules/conventions.md` §Base branch resolution. Simply omit `--base` below; do not re-derive it here. When resolution fails - either the AGENTS.md declaration was unresolvable, or every lower-tier automatic candidate failed validation - the binary names every candidate tried on stderr and exits 0 having removed nothing (fail-safe, not fatal - the same asymmetry the old inline pipeline had: a WARNING and a skipped reap for the session, never a hard nonzero exit that would abort Steps 3/4 below).

```bash
DS_CLEANUP_BIN=""
if [[ -n "${REPO_DIR:-}" ]] && [[ -x "$REPO_DIR/bin/ds-cleanup-worktrees" ]]; then
  DS_CLEANUP_BIN="$REPO_DIR/bin/ds-cleanup-worktrees"
elif command -v ds-cleanup-worktrees >/dev/null 2>&1; then
  DS_CLEANUP_BIN="$(command -v ds-cleanup-worktrees)"
fi

if [[ -n "$DS_CLEANUP_BIN" ]]; then
  # Default: actually remove, with a full per-entry breakdown. If the
  # operator asked for a preview/dry run instead ("show me what would be
  # removed", "don't delete anything yet"), add --dry-run - --explain
  # stays on either way so the report below has real detail to work from.
  # `--explain` alone does NOT imply `--dry-run`: without --dry-run this
  # invocation deletes. No --base flag: the binary resolves it itself (see
  # above) and prints which candidate it used.
  "$DS_CLEANUP_BIN" --explain
  DS_CLEANUP_STATUS=$?
  if [[ "$DS_CLEANUP_STATUS" -ne 0 ]]; then
    echo "ERROR: ds-cleanup-worktrees exited $DS_CLEANUP_STATUS - do NOT treat this as a completed reap. Stop and report the failure output above instead of proceeding to Steps 3/4 as though removal succeeded." >&2
    exit "$DS_CLEANUP_STATUS"
  fi
else
  echo "WARNING: ds-cleanup-worktrees not found (REPO_DIR/bin or PATH) - re-run your harness's DinoStack install script (<repo>/.claude/install.sh for Claude Code, the equivalent script under your adapter directory otherwise) to wire bin/ onto PATH. Worktree reap skipped this session." >&2
fi
```

This removes worktrees only - both isolation (`.claude/worktrees/*`) and feature/conductor-created (`.agentic/worktrees/*`) entries, per `classify_entry`'s path-prefix classification - never a branch. Branch deletion is Step 3's job, below, on its own separate proof: a bare `MERGE_EVIDENCE=merged`/PR-`MERGED` read is sufficient to reclaim a worktree (`git worktree remove` does not destroy commits) but is NOT sufficient evidence for `git branch -D` (DS-153 Amendment B1 - see the Notes section below). An `UNMANAGED` entry (a bare-repo entry, a path outside this repo's own host, or a path under neither admin directory, e.g. `evals/.worktrees/wt-*`) is always reported, never touched.

**The default 24h age floor and its escape.** A worktree younger than `--min-age-hours` (default 24) resolves `SKIP_TOO_YOUNG`, never `REMOVE`, regardless of how otherwise-eligible it is - the binary itself now prints an unconditional `NOTE:` line naming the count and the escape whenever that bucket is nonzero, so a `removed=0` run is never left unexplained. If the operator explicitly wants a specific, just-merged worktree gone right now, pass `--min-age-hours 0` for that invocation. State the tradeoff when doing so: this removes the protection against reaping a concurrent session's still-in-flight worktree (unlocked does not mean idle - a resumable session can leave its worktree unlocked between tool calls). Otherwise leave every flag but `--explain`/`--dry-run` at its default - `--base` is resolved automatically (see above) and is never operator-variable here; omit it, do not re-derive it.

---

## Step 3: Prune stale local branches

Run the canonical branch prune from `content/references/worktree-lifecycle.md §Branch prune (stale local branches)` - `bin/ds-branch-prune` (DS-153). It deletes a local branch only when a four-layer, first-match-wins subsumption predicate (ancestry, squash-patch equivalence, tip-subsumption, content-on-main) proves that branch's tip content is on `origin/main`; absence of proof is always `SKIP_UNPROVEN`, reported for manual review, never force-deleted. When `gh` is unavailable or errors, the predicate degrades to ancestry and content-on-main evidence only (L1/L4) - a strict subset, never a superset, of what a full run would delete - and the run names the degradation rather than staying silent.

---

## Step 4: Final state report

```bash
git worktree prune
git worktree list
```

Report a summary:
- What was removed (worktree path + branch name for each)
- What was skipped (branch name + reason: dirty, PR open, no PR, too young, unknown type)
- If Step 2 printed a `NOTE: N worktree(s) skipped because they are younger than the ... age floor` line, surface it prominently in this summary rather than letting `removed=0` stand unexplained - name the count and the `--min-age-hours 0` escape
- Final worktree count

---

## Notes

- **Safety first:** never remove a worktree with uncommitted changes without explicit user confirmation. `disposition_for`'s dirty check in Step 2 is not optional.
- Never remove a feature worktree whose PR is still OPEN. For a live worktree's own removal (Step 2, `disposition_for`), a MERGED PR alone remains sufficient evidence - `git worktree remove` does not destroy commits, so the worst case is already covered by `SKIP_DIRTY`/`SKIP_LOCKED` (DS-153 Amendment B1). This does NOT extend to local branch DELETION: `bin/ds-branch-prune` (Step 3, `disposition_for_orphan_branch`) treats a bare MERGED PR as terminally insufficient (`SKIP_PR_MERGED_UNPROVEN`) and requires the subsumption predicate to prove the tip's content is on `origin/main` before deleting.
- The main worktree (first entry in `git worktree list`) is always skipped.
- Works on the repository in the current working directory - not project-specific.
- If `gh` is not available, flag feature worktrees for manual review and continue.
