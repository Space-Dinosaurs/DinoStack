predicate gate 9). It also refuses to run at all in degraded gh mode (`--no-gh`, or `gh` unavailable/unauthenticated) - without PR evidence it cannot distinguish a genuinely-unprovable branch from one behind an open PR. For every whitelisted entry, it archives the full branch (every commit unique to it) into a verified `git bundle` under `.agentic/worktree-archive/` (never removing anything if the bundle create or verify fails), salvages telemetry (same guard as the plain removal path - a failed salvage also blocks removal), then removes the worktree and prints the exact restore command. **Compaction (DS-191):** when the resolved base branch's objects can be excluded from the bundle without producing an empty bundle, the exclusion is applied - the result is a small bundle plus a recorded prerequisite commit, useful specifically as a full-disk reclaim path, rather than a bundle that duplicates history already present on the base. This is skipped (a full-history bundle is produced instead, with a `NOTE:` printed to stderr) for any of several causes: the base ref cannot be verified locally, the branch shares no history with it, an explicit `--base` was supplied but does not resolve to the same commit this tool's own auto-resolution would have picked (refused outright, never compacted against an unvalidated caller-supplied ref - see `content/references/worktree-lifecycle.md`), a concurrent `git fetch` advanced the base ref past the branch tip between the pre-create measurement and the actual bundle creation (a TOCTOU race, retried once without compaction rather than left stuck), or the rev-list commit count could not be parsed - a compact bundle also requires that prerequisite commit to remain present in this repo's object store to restore (a full-history bundle has no such dependency). It removes the worktree only, never the branch - branch deletion remains `bin/ds-branch-prune`'s job. `.agentic/worktree-archive/` is gitignored (same `/.agentic/*` umbrella as `.agentic