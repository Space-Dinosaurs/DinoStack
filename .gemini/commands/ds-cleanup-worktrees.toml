**Which project is worst - `--report` (run this FIRST, before any multi-repo removal).** Worktrees accumulate across many project checkouts on one machine, and an operator with several of them has no single command telling them which project is the worst offender - `--dry-run` output is per-repo, so answering "which project should I clean first" meant running it once per checkout by hand and comparing by eye. `ds-cleanup-worktrees --multi-repo --report` answers that directly: it ranks every discovered repo, worst first. Two cost tiers, chosen by whether `--count-only` is ALSO given: `--report --count-only` (FAST/approximate - 2 git calls per repo, zero network; ranks by raw non-root worktree count, tie-broken by the oldest worktree's directory age, older-first - older accumulation ranks worse) is a cheap first look, but a weak proxy - 30 legitimately-active worktrees are not the same as 30 stale ones, and the printed table says so. This tier ALSO never resolves a base branch at all (round-N Minor 2), so a repo whose base cannot be resolved (e.g. no git remotes) still exits 0 and ranks as ordinary, actionable output here, even though the DEEP tier and the real sweep both exit 1 and skip that same repo - do not treat a clean-looking fast-tier table as proof every ranked repo is actually reapable; cross-check with plain `--report` or the sweep's own exit code first. Plain `--report` (DEEP/accurate - a full per-entry evaluation per repo, same cost as `--dry-run --explain`, just never acting on it) ranks by `(eligible desc, oldest worktree age desc)` - the count of entries that would actually resolve `REMOVE`, tie-broken the same way the fast tier is (round-N Minor 3, so the two tables don't reorder ties for no visible reason). Either tier accepts `--json` for machine-readable output (`{"tier": "fast"|"deep", "rows": [{"repo", "nonroot_worktrees", "oldest_age_hours", "eligible", "would_reclaim_kb", "dirty_unreclaimable_kb", "size_unknown_count", "pr_query_error_count"}, ...], "truncated": bool}` - `eligible` is `null` only under the fast tier; the three `--measure-size` fields (DS-216, see below) are always present but `null` unless `--measure-size` was also passed, and `null` unconditionally under the fast tier regardless of `--measure-size` (that tier never computes a disposition to measure against); `truncated` is `true` iff `--max-repos` cut the discovered-and-deduped set). `pr_query_error_count` (DS-217) closes a reporting gap: a repo whose entries were 100% `SKIP_PR_QUERY_ERROR` previously exited 0 and ranked as an ordinary clean sweep, invisible on this surface - it is `null` under the fast tier (never computed - that tier makes zero network calls) and an int (0 or more) under the deep tier UNCONDITIONALLY, no `--measure-size`-style flag required, since the deep tier's per-entry evaluation already produces this count for free; deep tier only, `_run_report` also adds a top-level `"pr_query_error_total"` int (the sum across `rows`, absent under the fast tier) and prints a `NOTE:` naming the affected repos whenever it is nonzero. Deep tier AND `--measure-size` together add two top-level keys: `"totals"` (`{"would_reclaim_kb", "dirty_unreclaimable_kb", "size_unknown_count"}`, each an int sum across `rows`) and `"measure_size_caveat"` (the same working-tree-only/object-store disclosure string the table/summary NOTEs print, since a JSON consumer never sees that stderr/stdout prose) - both absent (not merely `null`) when `--measure-size` was not also passed. Plain `--report --measure-size` WITHOUT `--json` prints the same per-row figures as extra table columns (abbreviated headers `dirty_kb`/`unk` alongside `would_reclaim_kb`), plus a separate `NOTE:` line carrying those three figures summed across every listed repo, plus the same FLOOR/object-store `NOTE:`s the single-repo summary prints when applicable - the deep tier already pays for the full `du -sk` walk regardless of `--json`, so this output was previously silently discarded.