## Step 1: Fetch and prune metadata

```bash
git fetch origin 2>/dev/null || true
git worktree prune

# Baseline for Step 4's before -> after delta. Captured AFTER
# `git worktree prune` on purpose: prune only drops registrations whose
# directories were already gone from disk, so those entries reclaim zero
# bytes and were never Step 2's to remove. Counting them in the baseline
# would inflate the delta into an accomplishment this run cannot back
# with a reclaimed_kb figure - the same projection-vs-actual discipline
# `--measure-size` enforces on bytes. The honest baseline is therefore
# "what actually existed on disk and was Step 2's to act on".
BEFORE_WORKTREES=$(( $(git worktree list | wc -l) - 1 ))
BEFORE_BRANCHES=$(( $(git for-each-ref --format='%(refname)' refs/heads/ | wc -l) ))
echo "BEFORE_WORKTREES=$BEFORE_WORKTREES"
echo "BEFORE_BRANCHES=$BEFORE_BRANCHES"
```

`git fetch origin` is non-fatal - repos without a remote (local test repos, offline environments) will fail here and that is fine. Always continue. `git worktree prune` removes entries pointing to directories that no longer exist on disk.

`BEFORE_WORKTREES` counts non-root worktree entries only (total `git worktree list` lines minus the main worktree, which is never removable); `BEFORE_BRANCHES` counts local branches, the population Step 3 prunes. Both are ECHOED rather than left in shell variables for Step 4 to read: each step's Bash block runs in its own shell, so a variable set here is not in scope there. Carry the two printed values forward into Step 4's report - they are the only record of the before-state, and once Steps 2 and 3 have run it cannot be recomputed.

