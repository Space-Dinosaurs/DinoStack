## Tracker Writeback Helper

Full reference (invocation contract, forward-only guard algorithm, diagnostic enrichment, failure/skip logging): `content/references/tracker-writeback.md`. Reusable subagent invocation pattern used by Phase 11, the 7 writeback call sites below (W1-W7), and the awaiting callers - 3 modes of `/ds-ticket-status-sync` (single-ticket, `--all`, `--pending-merge`) plus `/ds-wrap` Part F. Gated on `TRACKER != none`; no-op otherwise. Read that reference before invoking this Helper from any call site or modifying its algorithm.

**Caller enumeration (kept in the kernel so `scripts/codex-skills.py` can transform these caller-name tokens; `content/references/tracker-writeback.md` is a symlinked resource the transform never scans, so it points back here instead of repeating them):**
- Fire-and-forget applies at W1-W7 and Phase 11; the awaiting callers (all 4 above: the 3 `/ds-ticket-status-sync` modes plus `/ds-wrap` Part F) are enumerated in the forward-only guard's step 4.d.iv (see the reference for the full algorithm).
- `forward_only_guard: true` for every writeback caller - the 7 W1-W7 sites, Phase 11 (preserving its prior hardcoded `Testing` behavior), and the awaiting callers (all 4 above: the 3 `/ds-ticket-status-sync` modes plus `/ds-wrap` Part F).
- On the step 4.d.iv unmatched-state-name branch, fire-and-forget call sites (W1-W7, Phase 11) each emit one stderr line per fire. **Callers that await the result** (all 4 above: the 3 `/ds-ticket-status-sync` modes plus `/ds-wrap` Part F) do NOT get that per-ticket stderr line; they instead read `unmatched_state_name` from each ticket's return payload, accumulate across their sweep, and print exactly ONE aggregate line at the end.
- Fire-and-forget call sites (W1-W7, Phase 11) emit a `SKIPPED:` stderr line for a `skipped_unconfigured_state` outcome. Callers that await the result (all 4 above: the 3 `/ds-ticket-status-sync` modes plus `/ds-wrap` Part F) read `status` and `diagnostic` from the return payload instead and format them per their own operator-visible-line conventions.
- **Full return-status set:** `ok | partial | failed | skipped_unconfigured_state | skipped_transitions_manual`. The last means only the STATE TRANSITION was suppressed; `comment_posted`/`assigned` still reflect reality - see `content/references/tracker-writeback.md`'s `skipped_transitions_manual` clause for the payload shape (`diagnostic: null`), and each awaiting caller's own operator-visible-line convention for how it renders that (`content/commands/ds-ticket-status-sync.md` Resolution algorithm step 6 and Tracker-wide-sweep step 8; `content/commands/ds-wrap.md` Part F). Fire-and-forget call sites (W1-W7, Phase 11) emit NO stderr line for this status - not one per fire, and not one per run.
  This is deliberately NOT the bullet above's one-line-per-fire `skipped_unconfigured_state` convention. An unconfigured state is a per-ticket fact the operator has not seen; `manual` is one static project setting the operator set themselves, and repeating it at up to 8 sites per ticket for the life of the project is status the operator must read and can do nothing differently about. The operator is never left without an indication, and the rule needs no persisted state to say so: every fire-and-forget site lives inside a `/ds-implement-ticket` run, and every such run prints `TRACKER_TRANSITIONS_MODE` (with its consequence spelled out when the value is `manual`) exactly once before any of them can fire - from Setup above on a fresh run, and from the Resume check's own resolve-and-print obligation on a resumed one, which never reaches Setup. A suppress-after-first rule would instead need a cross-invocation flag with a named state location and a defined session boundary - the shape `.agentic/.pending-merge-last-sweep` and `loop-state-<LOOP_KEY>.json` have - and would still be ambiguous across resumed sessions and parallel worktrees. Suppressing the line entirely costs the operator nothing the Setup print does not already give them. `content/references/tracker-writeback.md` states the same rule.
- **This ranking never reads `.agentic/tracker-states.json`.** It uses only the live pre-read of the ticket's own current state and the 6 `tracker_state_values` strings resolved once in Setup above. The Phase 2c cache remains Phase 2c-only and purely advisory; no writeback subagent reads or writes it.

