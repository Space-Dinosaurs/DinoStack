PRIOR QA FAILURES DETECTED. The following comments indicate prior QA failures on this ticket:
[bullet list of each PRIOR_QA_COMMENTS entry]

Factor these into the implementation plan. Ensure the plan explicitly addresses each prior QA failure point.
```

Omit this entire section when `COMMENT_THREAD_SUMMARY` is empty (TRACKER=none, empty thread, or comment fetch failed).

**Ticket-rework callout (inject only when `IS_REWORK` is true) — independent top-level block:**

Inject it whenever `IS_REWORK` is true, whether or not "Prior ticket context" was injected, and in either order. Why: `ticket-rework.md`.

Append the following block to the architect spawn brief when `IS_REWORK` is true:

```
## PRIOR ATTEMPT(S) OPENED A PR - THIS IS REWORK

AE has already carried this ticket to an opened PR [PRIOR_ATTEMPTS] time(s). The most recent attempt:

- PR: #[pr_number] ([opened_ts])
- Risk class: [risk_class]
- Skeptic rounds: [skeptic_rounds, or "n/a" when null]
- QA: [qa_status, or its "skipped:<rationale>" value, or "n/a"]
- Units: [unit_count]
[when PRIOR_ATTEMPTS > 1: - Earlier attempts: PR #<a>, #<b>]

Something about the prior attempt was insufficient, OR this ticket was always going to need
another wave - AE cannot tell which, and does not guess. Treat it as the former.

Your plan MUST:
1. Identify what the prior attempt missed, got wrong, or left incomplete. Read the prior PR's
   diff and reviews (`gh pr view N --json reviews,comments`, `gh api
   repos/{owner}/{repo}/pulls/N/comments`, N the PR above) before planning. Plan a per-comment
   sweep (`skeptic-protocol.md` §Round budget item 6) and say whether a concern repeats an
   earlier one. State your conclusion explicitly, even if it is "the prior attempt
   looks complete and this appears to be planned continuation" - that is a finding, not a
   non-answer, and the Skeptic will grade it.
2. Include at least one `qa_criteria` scenario that exercises the specific regression or gap
   you identified. A rework plan whose QA criteria do not cover the failure mode that brought
   the ticket back has not addressed the rework.
```

Apply the null-render rule when filling this block: a null `skeptic_rounds` renders `n/a`; a null `qa_status` renders its `skipped:<rationale>` value when one exists, otherwise `n/a`. Never emit a bare `null` into a spawn brief.

**Architect plan Skeptic review (mandatory):** After the Architect returns its plan, spawn a Skeptic with the "Document synthesis, architecture, and planning" adversarial brief plus the Global-context input set (`## Global-context inputs` block per `content/references/skeptic-protocol.md` Section 4.5) - this is a pre-implementation review, so field 6 (diff under review) leads with `${LOOP_KEY}-plan | ` then the plan-proposed file paths, not a git diff, field 1 (architect plan) is the plan itself under review, field 2 (Brief/Plan artifact) is `n/a - Skeptic-on-plan (Brief authoring gated on this sign-off)` when no Brief exists yet; field 7 per §4.5. Do not proceed to Phase 3b or Phase 4 until the Skeptic grants sign-off. If the Skeptic-approved plan contains a non-empty "Open questions" section, resolve every genuine Open Question before proceeding - see `METHODOLOGY.md` for resolution paths. A plan with only a "Deferred defaults" section (empty or non-empty) and an empty "Open questions" section does not block. For the full adversarial brief menu, see `~/DinoStack/.claude/skills/dinostack/references/skeptic-protocol.md`.

**Tier:** Declare a tier if this spawn warrants non-default model selection (see Tier declaration in METHODOLOGY.md). Default: role default (omit the model param).

