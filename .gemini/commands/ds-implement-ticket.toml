## Phase 9: Open the PR

**UNIT_IS_BEHAVIOR_VISIBLE derivation.** Set this variable before composing the PR body. It is "true" only when ALL hold:
- `QA_RAN_AND_PASSED == "true"` (Phase 6b clean exit)
- `QA_EVIDENCE_URLS` is non-empty
- the unit's risk class - taken from the conductor's in-context risk classification (declared at Phase 2/3) and the architect plan - is NOT one of: security, auth, crypto, payments, or Elevated-correctness

Default is "false"; use "false" when ambiguous. (Conservative: a false default keeps the existing append-after-Summary behavior; it never leads with evidence on a security/correctness unit.) Derived in-context by the conductor; not stored in or read from a state file.

Compose the `[TRACKER_REFERENCE_BLOCK]` based on the resolved `TRACKER`, then run the `gh pr create` command with that block included in the body.

#### If TRACKER is `linear`

```
## Linear
Closes [[TICKET_PREFIX]-NNN](https://linear.app/[LINEAR_WORKSPACE]/issue/[TICKET_PREFIX]-NNN)
```

#### If TRACKER is `jira`

```
## Jira
Closes [[TICKET_PREFIX]-NNN]([JIRA_BASE_URL]/browse/[TICKET_PREFIX]-NNN)
```

#### If TRACKER is `none`

Omit the tracker reference block entirely. The PR body will have only Summary, Test plan, and the Developer/Model attribution lines (each appended only when its value is known), and the PR title should omit the `[TICKET_PREFIX]-NNN:` prefix.

---

Open as draft PR. GitHub does not request reviewers on a draft; reviewers are assigned in Phase 10b after CI passes.

Authoring rule: §External Comment Discipline in `content/rules/conventions.md` applies - lead with the result, bullets over prose, cut anything the diff already shows. Summary ≤ 5 single-line bullets; QA Evidence/tracker ref/Test plan excluded (§Assembled PR bodies).

Run:

```bash
# Resolve identity for PR Developer: field (may already be set from Phase 8).
# Re-derive here if Phase 8 was skipped (e.g., parallel path with no fixup files).
# Note: `show` (no --scope) resolves the project-local identity first per the 4-tier ordering.
DEVELOPER=${DEVELOPER:-$(ds-identity show 2>/dev/null | awk '/^developer_id:/{print $NF}')}
if ds-identity show 2>/dev/null | grep -qE '^provisional:[[:space:]]+true'; then DEVELOPER=""; fi

# Model: line source is author_model on this ticket's engineer claims in .agentic/tasks.jsonl
# (written at both Phase 5 claim sites), so it survives a resumed session. Single-unit plans
# write no tasks.jsonl, so the line is omitted there, as it is when the model is unknown.
ENGINEER_MODEL=$(jq -sr --arg t "$TICKET_ID" '
  [.[] | select(.ticket_id == $t and .assigned_agent == "engineer"
    and .author_model != null and (.status == "in_progress" or .status == "done"))
    | .author_model]
  | unique | join(", ")' .agentic/tasks.jsonl 2>/dev/null || true)

# UNIT_IS_BEHAVIOR_VISIBLE: true only when QA ran+passed, evidence URLs exist, AND risk class is
# not security/auth/crypto/payments/Elevated-correctness (derived in-context from Phase 2/3
# risk classification and architect plan; default false when risk class is ambiguous).
UNIT_IS_BEHAVIOR_VISIBLE="false"
if [ "$QA_RAN_AND_PASSED" = "true" ] && [ "${#QA_EVIDENCE_URLS[@]}" -gt 0 ]; then
  # Set to "true" only when the conductor's in-context risk class is behavior-visible Elevated
  # (UI changes, behavioral feature additions). Must remain "false" for security, auth, crypto,
  # payments, or Elevated-correctness units regardless of QA state.
  UNIT_IS_BEHAVIOR_VISIBLE="[true|false - conductor sets based on in-context risk class]"
fi
```

**Case A - behavior-visible unit with QA evidence (`UNIT_IS_BEHAVIOR_VISIBLE == "true"`):**

Lead the PR body with `## QA Evidence` so reviewers see runtime confirmation first.

**Case B - all else (UNIT_IS_BEHAVIOR_VISIBLE false, or QA_EVIDENCE_URLS empty, or QA_RAN_AND_PASSED != "true"):**

Use the existing Summary-first body and append QA evidence after PR creation.

**Filling the free-text slots (binding, both cases).** Start from the Phase 6-reviewed draft if one exists (none on Trivial or after a resumed session). The templates below are lean; `[bullet N]` and `[step N]` are where a PR body bloats. Fill them under `content/rules/conventions.md` §Writing Style (lead with the primary information, write for the permanent audience - so no review-round or QA-round narration) and the per-surface rules in `content/references/conventions-detail.md` §External Comment Discipline and §Assembled PR bodies.

**`## North Star alignment` (binding, both cases).** Never leave `[pillar]` or `[trade-off]` literal - an unfilled placeholder counts as an absent section. With no `docs/overview/vision.md` in the ticket repo, fill the section `N/A - no docs/overview/vision.md in this repository`. With one, fill from the architect plan's pillars - including those cutting AGAINST the change, not only the supporting ones - or `N/A - <reason>` under the rule `.github/PULL_REQUEST_TEMPLATE.md` states for its own copy. Emit at `gh pr create` time, not a later `gh pr edit`: `--body-file` bypasses that template, which only populates web-UI PRs. `check-vision-alignment` gates this on the DinoStack repo; elsewhere it may not gate at all.

Set `DELIVERY_RECORD_OWNER` to the actual PR owner before either body variant.

```bash
if [ "$UNIT_IS_BEHAVIOR_VISIBLE" = "true" ] && [ "${#QA_EVIDENCE_URLS[@]}" -gt 0 ]; then
  # Case A: behavior-visible unit - lead with QA Evidence so reviewers see runtime confirmation first
  EVIDENCE_WRITTEN_TO_BODY="true"
  PR_BODY_FILE="/tmp/pr-body-$$"
  printf "## QA Evidence\\n\\n" > "$PR_BODY_FILE"
  for entry in "${QA_EVIDENCE_URLS[@]}"; do
    CRITERION=$(echo "$entry" | jq -r '.criterion_id')
    DESC=$(echo "$entry" | jq -r '.description')
