# Purpose: Canonical project scaffolding manifest. Defines the additive gitignore
#          patterns and seed files that every dinostack project should have.
#          Consumed by bin/ds-migrate (apply/check/diff subcommands) and surfaced
#          at preflight Step 6 to auto-apply drift.
#          v2: adds !.agentic/learnings.md negation + learnings.md seed so fix-patterns
#              are committed and shared across operators by default.
#          v3: adds !.agentic/team.yml negation so cross-harness team topology is
#              committed shareable project intent (like config.json).
#          v4: adds !.agentic/skill-candidates.md negation + seed so the skill-candidate
#              backlog is committed and visible to all team members by default.
#          v5: adds !.agentic/qa.md, !.agentic/deploy.md, !.agentic/tracking.md
#              negations. These three tool-agnostic config files were already
#              declared committed by /ds-init-project Step 9, but this manifest
#              never carried a matching negation, so a repo that adopted the
#              .agentic/* umbrella via ds-migrate (rather than /ds-init-project)
#              silently ignored all three.
#          v6: adds !.agentic/phase0-classifiers.yml and
#              !.agentic/deferred-work.jsonl negations, closing a divergence
#              between the two adoption paths caught by
#              bin/tests/test_agentic_migrate.py's
#              test_negation_set_matches_tracked_outcome: both files are
#              tracked by /ds-init-project Step 9 (phase0-classifiers.yml is
#              executable-code-equivalent and deliberately committed;
#              deferred-work.jsonl is a durable cross-teammate backlog, same
#              shape as skill-candidates.md) but this manifest's umbrella
#              ignored both with no negation, so a repo adopted via ds-migrate
#              silently ignored files a repo scaffolded via /ds-init-project
#              commits by default.
#          v7: /ds-init-project Step 9 is inverted from a default-allow
#              denylist to a default-deny umbrella (same shape as this
#              manifest) and now literally runs `ds-migrate apply` against
#              THIS file instead of hand-copying a second gitignore block -
#              the two adoption routes share one source from this version
#              forward and can no longer diverge by construction. Adds
#              !.agentic/presets.yml: per-path review of files newly exposed
#              by the inversion (see content/commands/ds-init-project.md
#              Step 9's "Deliberately excluded" paragraph for the full list
#              and rationale) found presets.yml is the one that should be
#              tracked - its schema (agent/tier/brief_prefix, see
#              content/references/spawn-presets.md) carries no model handles
#              or other private data, unlike .agentic/tier-map.yml and
#              .agentic/role-models.yml (both hold concrete model names/IDs
#              and stay ignored, un-negated, for that reason) - and a
#              project-local .agentic/presets.yml is exactly the kind of
#              shared, team-visible project override this manifest already
#              tracks .agentic/config.json for. /ds-init-project deliberately
#              does NOT seed .agentic/presets.yml (only ~/.agentic/presets.yml,
#              the user-global library - see Step 6d); the negation here only
#              makes a project-local presets.yml committable if and when an
#              operator chooses to author one, it does not create the file.
#          v8: adds !.agentic/memory-shards/ + !.agentic/memory-shards/**
#              negations (DS-221 Unit 1, memory shard compiler). CORRECTED:
#              measured directly on git 2.55.0 against this repo's
#              ".agentic/*" umbrella (a one-level glob, not the bare/
#              recursive ".agentic/" form some other rules warn cannot be
#              pierced at all) - the BARE directory negation
#              (!.agentic/memory-shards/) is SUFFICIENT ON ITS OWN to
#              un-ignore every path nested inside it; the recursive
#              !.agentic/memory-shards/** sibling is REDUNDANT in its
#              presence (and, on its own without the bare form, actually
#              INSUFFICIENT - it does not un-ignore the directory entry
#              ".agentic/*" itself matches, so nothing under it is reached).
#              Both lines are kept anyway, matching the existing
#              !.agentic/session-log/** precedent (same measured
#              redundancy, kept for defense-in-depth / pattern parity
#              across the two directory-form carve-outs in this manifest)
#              - this is a deliberate belt-and-suspenders choice, not a
#              correctness requirement. See
#              content/references/memory-shard-convention.md's
#              Verification section for the corrected prose. This ships
#              the compiler + convention only; nothing
#              writes into .agentic/memory-shards/ yet (writer wiring is a
#              later unit's scope, gated by the new memory_shard_mode
#              toggle, default false), so this negation makes the directory
#              committable ahead of that wiring rather than retrofitting it
#              later.
# Public API: read by bin/ds-migrate; version field (scaffolding_version) compared
#             against <project>/.agentic/config.json scaffolding_version stamp.
#             Also read directly by /ds-init-project Step 9, which invokes
#             `ds-migrate apply` against this manifest as its sole mechanism
#             for the `.agentic/` portion of a fresh project's .gitignore -
#             this file is the single source of truth for BOTH adoption
#             routes as of v7.
# Upstream: none (this is the canonical source)
# Downstream: bin/ds-migrate, content/sections/01-activation-preflight.md (Step 6),
#             content/commands/ds-migrate-project.md,
#             content/commands/ds-init-project.md (Step 9, as of v7)
# Failure modes: if malformed or missing, ds-migrate exits 2 and skips migration;
#                preflight swallows the error silently and proceeds with methodology active.

scaffolding_version: 8
gitignore:
  - pattern: ".agentic/*"
    purpose: "umbrella ignore"
  - pattern: "!.agentic/config.json"
    purpose: "committed: methodology toggles"
  - pattern: "!.agentic/qa-regressions.md"
    purpose: "committed: qa regression patterns shared across operators"
  - pattern: "!.agentic/session-log/"
    purpose: "committed: Stage 1 telemetry"
  - pattern: "!.agentic/session-log/**"
    purpose: "committed: Stage 1 telemetry contents"
  - pattern: "!.agentic/learnings.md"
    purpose: "committed: per-ticket fix-pattern learnings shared across operators"
  - pattern: "!.agentic/team.yml"
    purpose: "committed: cross-harness team topology (shareable project intent)"
  - pattern: "!.agentic/skill-candidates.md"
    purpose: "committed: skill-candidate backlog shared across operators"
  - pattern: "!.agentic/qa.md"
    purpose: "committed: tool-agnostic QA scenario definitions shared across operators"
  - pattern: "!.agentic/deploy.md"
    purpose: "committed: tool-agnostic deploy runbook shared across operators"
  - pattern: "!.agentic/tracking.md"
    purpose: "committed: tool-agnostic tracker config shared across operators"
  - pattern: "!.agentic/phase0-classifiers.yml"
    purpose: "committed: executable-code-equivalent Phase 0 classifiers, same as /ds-init-project Step 9"
  - pattern: "!.agentic/deferred-work.jsonl"
    purpose: "committed: durable cross-teammate deferred-work backlog, same as /ds-init-project Step 9"
  - pattern: "!.agentic/presets.yml"
    purpose: "committed: project-local spawn-preset overrides (agent/tier/brief_prefix only - no model handles, unlike tier-map.yml/role-models.yml)"
  - pattern: "!.agentic/memory-shards/"
    purpose: "committed: memory shard directory (DS-221 Unit 1) - one fact per file. Sufficient on its own under this manifest's .agentic/* umbrella (measured, git 2.55.0)"
  - pattern: "!.agentic/memory-shards/**"
    purpose: "committed: memory shard directory contents - redundant alongside the bare directory negation above (kept for parity with the !.agentic/session-log/** precedent, same measured redundancy there)"
files:
  - path: ".agentic/config.json"
    seed: "templates/.agentic/config.json"
    purpose: "project methodology toggles"
  - path: ".agentic/learnings.md"
    seed: "templates/.agentic/learnings.md"
    purpose: "per-ticket fix-pattern learnings - header-only stub; entries appended by agents"
  - path: ".agentic/skill-candidates.md"
    seed: "templates/.agentic/skill-candidates.md"
    purpose: "skill-candidate backlog - header-only stub; entries written by wrap-time detector (Stop-hook scan path is dormant)"
markers: []   # parsed only by /ds-migrate-project --include-destructive; preflight apply IGNORES this key
