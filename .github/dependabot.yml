# Scopes Dependabot version-update PRs to real project manifests.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/scripts"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    # @marp-team/* is pinned to exact versions and upgraded only as a coordinated
    # same-PR action (bump all three packages + lockfile + rebuild slides). Single-
    # package automated bumps break the slides-sync CI gate.
    #
    # This suppresses SECURITY updates as well as version updates, so
    # Dependabot will not open a PR for any advisory that remediates through
    # @marp-team/* - by this deliberate choice, not because the automation
    # failed to see it. See the
    # Retirement block in scripts/check-npm-audit.sh: its retirement test
    # cannot be run on an advisory whose remediating package is ignored here.
    ignore:
      - dependency-name: "@marp-team/*"

  # Root has one direct dependency (eslint), so PR volume
  # here is low. This entry keeps that dependency current; it does not by itself
  # prevent a repeat of the transitive js-yaml/brace-expansion drift that motivated
  # it. That class is governed by security alerts, which are independent of
  # version-update scope, so this entry says nothing about whether such an
  # advisory gets acted on. scripts/check-npm-audit.sh is the compensating
  # control for that.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
