name: adapter-sync
on:
  # PR-only. The post-merge run is not deleted, it is consolidated into
  # verify-merged-tree.yml, which re-runs this check on `main` only when an
  # `--admin` merge bypassed the ruleset's up-to-date requirement and landed
  # a tree no PR run tested. Measurement, policy and retirement (the only
  # site carrying the figures): .github/workflows/AGENTS.md
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# Claude Code first (root AGENTS.md): a methodology PR regenerates only
# `.claude`. The non-Claude adapters are rebuilt and drift-checked only on
# the on-demand catch-up chore PR, whose branch starts with
# `chore/adapter-catch-up`, which sets DS_ALL_HARNESSES.
env:
  DS_ALL_HARNESSES: ${{ startsWith(github.head_ref, 'chore/adapter-catch-up') && '1' || '' }}
jobs:
  check-adapter-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: Rebuild the Claude Code adapter
        run: bash .claude/build.sh
      - name: Verify adapter-sync pathspec entries exist
        run: |
          for p in .claude; do
            if [[ ! -e "$p" ]]; then
              echo "::error::adapter-sync pathspec entry missing: $p (drift check would silently pass on this)" >&2
              exit 1
            fi
          done
      - name: Fail on adapter drift
        run: |
          if ! git diff --exit-code -- .claude; then
            echo "::error::Claude Code adapter output is out of sync with content/. Run bash .claude/build.sh locally and commit the regenerated files." >&2
            exit 1
          fi
      - name: Rebuild the non-Claude adapters
        if: env.DS_ALL_HARNESSES == '1'
        run: |
          bash .cursor/build.sh
          bash .codex/build.sh
          bash .gemini/build.sh
          bash .kimi/build.sh
          bash .opencode/build.sh
          bash .omp/build.sh
          bash .pi/build.sh
          bash .hermes/build.sh
          bash .openclaw/build.sh
          bash .copilot/build.sh
      - name: Verify non-Claude adapter-sync pathspec entries exist
        if: env.DS_ALL_HARNESSES == '1'
        run: |
          for p in .codex .cursor .gemini .kimi .opencode .omp .pi .hermes .openclaw .copilot \
                   .github/copilot-instructions.md .github/agents .github/prompts .github/instructions .github/hooks .github/skills; do
            if [[ ! -e "$p" ]]; then
              echo "::error::adapter-sync pathspec entry missing: $p (drift check would silently pass on this)" >&2
              exit 1
            fi
          done
      - name: Fail on non-Claude adapter drift
        if: env.DS_ALL_HARNESSES == '1'
        run: |
          if ! git diff --exit-code -- .codex .cursor .gemini .kimi .opencode .omp .pi .hermes .openclaw .copilot .github/copilot-instructions.md .github/agents .github/prompts .github/instructions .github/hooks .github/skills; then
            echo "::error::Non-Claude adapter output is out of sync with content/. Run bash scripts/build-all.sh and commit the regenerated adapter files." >&2
            exit 1
          fi
      - name: Verify Codex hook commands resolve (DS-57 regression guard)
        run: bash bin/tests/test_codex_hooks_resolve.sh
      - name: Verify dinostack skill symlinks are relative (DS-104 regression guard)
        run: bash scripts/check-symlinks-relative.sh "${{ github.sha }}"
