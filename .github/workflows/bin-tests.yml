name: bin-tests
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  python-bin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pytest pyyaml
      - run: python3 -m pytest bin/tests/ -q
