name: bin-tests
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  python-bin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest pyyaml
      - run: python3 -m pytest bin/tests/ -q
  # Python hook tests live here (shared python toolchain with bin-tests); JS/sh
  # hook tests live in hooks-tests.yml.
  hooks-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: run Python hook tests
        run: |
          set -e
          count=0
          for f in hooks/tests/test-*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: glob hooks/tests/test-*.py matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count Python hook test files"
