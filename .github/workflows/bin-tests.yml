name: bin-tests
on:
  pull_request:
  push:
    branches:
      - main
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
# TIMEOUT POLICY (all three jobs below).
#
# A job's `started_at` is stamped at RUNNER ASSIGNMENT, not at first-step
# execution, so a job-level `timeout-minutes` can be consumed entirely by queue
# wait. That is not hypothetical here: python-bin-tests was cancelled on this
# repo having recorded `steps: []` - no step ever ran - and bin-sh-tests was
# cancelled the same way on main (run 31115638748, sha f81b63c0).
#
# So: job-level `timeout-minutes` is a BACKSTOP ONLY (20), and every network
# install/download step and every test-execution step carries its own
# `timeout-minutes`, which starts when the step starts and is therefore immune
# to acquisition delay. Do not "fix" a queue-starvation cancellation by raising
# the job timeout alone - that trades a fast silent failure for a slow one and
# leaves the steps unbounded. `actions/checkout` and `actions/setup-python` are
# deliberately excluded from this policy: they are cache-backed GitHub-hosted
# actions, not custom network commands, and no stall on either has been
# observed here.
jobs:
  python-bin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep partial output if the job is force-killed anyway.
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # pytest-timeout converts an unbounded subprocess stall anywhere in
      # bin/tests/ into ONE failing test with a stack trace at the exact call,
      # instead of a killed job with no usable log.
      - name: pip install pytest pytest-timeout pytest-xdist pyyaml
        # Bounded so a queue-starved or hung step fails as itself rather
        # than consuming the job backstop. Re-derive the current
        # distribution with `bash scripts/ci-step-durations.sh` before
        # changing any value here.
        timeout-minutes: 2
        run: pip install pytest pytest-timeout pytest-xdist pyyaml
      - name: install zsh and jq (required for the bash/zsh parity matrix in
          test_phase8_telemetry_shell.py, and for test_auto_merge_followthrough_shell.py's
          real-jq sibling-PR-sweep filter tests - jq's own _require_jq() guard
          hard-fails under CI rather than silently skipping if this is ever removed)
        # Bounded so a queue-starved or hung step fails as itself rather
        # than consuming the job backstop. Re-derive the current
        # distribution with `bash scripts/ci-step-durations.sh` before
        # changing any value here. This step's own prior, tighter bound
        # (5 minutes) was empirically too tight and failed real runs; this
        # step (and its sibling in bin-sh-tests, same command, separate
        # runner) has also genuinely run past 20 minutes on an apt mirror
        # stall and been killed by the job backstop above rather than its
        # own step bound - a step-level bound turns that into a
        # diagnosable failure at its own value instead of an
        # undiagnosable one at the job backstop. That is the bound's
        # intended job: catching a genuinely hung apt, not a slow one.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y zsh jq
      - run: python3 -m pytest bin/tests/ -q --timeout=60 --timeout-method=thread
        # Measured 2026-10-13 with `bash scripts/ci-step-durations.sh` over
        # the 95 most recent runs, all conclusions: median 209 s, p95 245 s,
        # max 301 s. The prior 5-minute bound killed a run whose 3167 tests
        # had all passed in 299.79 s (run 38408803038). 15 minutes is about
        # 3x that max and stays inside the job backstop. Re-run the script
        # before changing this value, and revisit it when the script's max
        # for this step passes 450 s, half the bound.
        #
        # Serial on purpose, unlike scripts/check-local.sh's pytest-xdist run
        # of the same suite. Under xdist, --timeout-method=thread ends the
        # worker process, so a timed-out test is reported as "worker crashed"
        # with no stack trace.
        timeout-minutes: 15
      - name: floor collected test_phase8_telemetry_shell.py count at 20
        # 10 test functions x 2 shells (bash, zsh) = 20 collected IDs (round
        # 12 added test_correct_block_aborts_loudly_on_defeated_negation, the
        # point-of-use defeated-negation loud-fail test). Adding or removing
        # a test function in bin/tests/test_phase8_telemetry_shell.py
        # obliges updating the floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_phase8_telemetry_shell.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 20) { print "expected >= 20 collected tests (10 functions x 2 shells), got " $1; exit 1 } }'
      - name: floor collected test_qa_knowledge_capture_shell.py count at 52
        # 18 test functions - 17 parametrized x {bash, zsh, sh} (51) plus 1
        # static, shell-independent assertion (1) = 52 collected IDs. Adding
        # or removing a test function in
        # bin/tests/test_qa_knowledge_capture_shell.py obliges updating the
        # floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_qa_knowledge_capture_shell.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 52) { print "expected >= 52 collected tests (17 functions x 3 shells + 1 static), got " $1; exit 1 } }'
      - name: floor collected test_knowledge_harness_smoke.py count at 31
        # 18 test functions - 13 parametrized x {bash, zsh} (26) plus 5 static,
        # shell-independent assertions (5) = 31 collected IDs. Adding or
        # removing a test function in
        # bin/tests/test_knowledge_harness_smoke.py obliges updating the floor
        # below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_knowledge_harness_smoke.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 31) { print "expected >= 31 collected tests (13 functions x 2 shells + 5 static), got " $1; exit 1 } }'
      - name: floor collected test_phase11e_knowledge_commit_shell.py count at 79
        # 41 test functions - 38 parametrized x {bash, zsh} (76) plus 3 static,
        # shell-independent assertions (3) = 79 collected IDs (four two-tier
        # memory-shard ride-along cases added with bin/ds-memory-capture).
        # Adding or removing a test
        # function in bin/tests/test_phase11e_knowledge_commit_shell.py
        # obliges updating the floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_phase11e_knowledge_commit_shell.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 79) { print "expected >= 79 collected tests (38 functions x 2 shells + 3 static), got " $1; exit 1 } }'
      - name: floor collected test_agent_return_contract_mutation.py count at 26
        # 21 mutation entries in MUTATIONS (one test_mutation_<id> each - 17
        # pre-round-6, 3 round-6 regression mutations (one per Major
        # finding), plus 1 round-7 regression mutation pinning the
        # SHAPE3_BARE_STATUS_TOKEN_RE permissive-widening direction) plus
        # test_no_survivors (1) plus 4 seed-baseline sanity tests
        # (test_shape1_seed_is_baseline_compliant,
        # test_shape2_seed_is_baseline_compliant,
        # test_shape4_seed_is_baseline_compliant, and
        # test_skeptic_seed_is_the_real_migrated_baseline -
        # the skeptic-baseline check IS one of these 4, not a separate 5th)
        # = 26 collected IDs. Removing an operator from MUTATIONS without
        # shrinking this floor is exactly the failure mode this gate exists
        # to catch (round-5 finding: removing one operator left the suite
        # green with `len(MUTATIONS) == 12` and nothing red). Adding or
        # removing a mutation in
        # bin/tests/test_agent_return_contract_mutation.py's MUTATIONS list
        # obliges updating the floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_agent_return_contract_mutation.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 26) { print "expected >= 26 collected tests (21 mutations + 1 aggregate + 4 seed-baseline, incl. skeptic baseline), got " $1; exit 1 } }'
  # Python hook tests live here (shared python toolchain with bin-tests); JS/sh
  # hook tests live in hooks-tests.yml.
  hooks-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: run Python hook tests
        timeout-minutes: 5
        run: |
          set -e
          count=0
          for f in hooks/tests/test-*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: glob hooks/tests/test-*.py matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count Python hook test files"
  # Discovers and runs shell-based test suites no other workflow covers: the
  # bin/tests/test_*.sh convention plus 4 orphaned *.test.sh files scattered
  # across other dirs (different naming convention, previously unwired anywhere).
  bin-sh-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: pip install pytest pytest-timeout pytest-xdist pyyaml
        # pytest, pytest-timeout and pytest-xdist are here for
        # test_check_local.sh, not for this job to run pytest itself:
        # check-local.sh's toolchain preflight probes
        # `import pytest, pytest_timeout, xdist, yaml` as one unit, and the
        # suite hard-fails under ${CI} rather than skipping when it is
        # unsatisfied. With pytest absent the suite aborts at its first guard;
        # with pytest present but pytest_timeout missing the preflight exits 2
        # and 16 scenarios fail expecting exit 1 - both measured. Mirrors
        # python-bin-tests' pip line above; keep the two in step.
        # Bounded so a queue-starved or hung step fails as itself rather
        # than consuming the job backstop. Re-derive the current
        # distribution with `bash scripts/ci-step-durations.sh` before
        # changing any value here.
        timeout-minutes: 2
        run: pip install pytest pytest-timeout pytest-xdist pyyaml
      - name: install zsh (required for bash/zsh parity assertion in test_check_resident_budget.sh)
        # Bounded so a queue-starved or hung step fails as itself rather
        # than consuming the job backstop. Re-derive the current
        # distribution with `bash scripts/ci-step-durations.sh` before
        # changing any value here. This step's own prior, tighter bound
        # (5 minutes) was empirically too tight and failed real runs; this
        # step (and its sibling in python-bin-tests, same command,
        # separate runner) has also genuinely run past 20 minutes on an
        # apt mirror stall and been killed by the job backstop above
        # rather than its own step bound - a step-level bound turns that
        # into a diagnosable failure at its own value instead of an
        # undiagnosable one at the job backstop. That is the bound's
        # intended job: catching a genuinely hung apt, not a slow one.
        timeout-minutes: 10
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: install gitleaks CLI (required by test_gitleaks_allowlist_scope.sh)
        # test_gitleaks_allowlist_scope.sh hard-fails under CI if gitleaks is
        # missing on PATH (a silently-skipped security regression guard is
        # indistinguishable from a passing one), so this step must always
        # succeed here. Version and checksum are read from
        # .github/workflows/gitleaks.yml at CI time rather than hardcoded, so
        # bumping that pin cannot silently drift from this install step.
        # Bounded so a queue-starved or hung step fails as itself rather
        # than consuming the job backstop. Re-derive the current
        # distribution with `bash scripts/ci-step-durations.sh` before
        # changing any value here.
        timeout-minutes: 2
        run: |
          set -euo pipefail
          version="$(grep -E '^[[:space:]]*GITLEAKS_VERSION:' .github/workflows/gitleaks.yml | head -1 | sed -E 's/^[^:]*:[[:space:]]*//')"
          sha256="$(grep -E '^[[:space:]]*GITLEAKS_SHA256:' .github/workflows/gitleaks.yml | head -1 | sed -E 's/^[^:]*:[[:space:]]*//')"
          if [ -z "$version" ] || [ -z "$sha256" ]; then
            echo "ERROR: could not read GITLEAKS_VERSION/GITLEAKS_SHA256 out of .github/workflows/gitleaks.yml" >&2
            exit 1
          fi
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          curl -sSfL "$url" -o "$tarball"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: build the adapters once (install.sh's own build, skipped below)
        # The two builds .claude/install.sh runs. Run once here so the shell
        # tests' installs can skip them; adapter-sync.yml gates the build
        # output itself.
        timeout-minutes: 2
        run: bash .claude/build.sh && bash .cursor/build.sh
      - name: run shell bin tests
        # AE_INSTALL_SKIP_BUILD=1 makes every .claude/install.sh call in
        # these tests skip its adapter rebuild, as scripts/check-local.sh
        # does after its own build. Measured locally 2026-10-13, same 81
        # files both ways, every file exit 0 and identical PASS-line counts
        # (2009): 1236 s without it, 706 s with it (the build step above
        # included). .claude/tests/install-converge.test.sh case (n) unsets
        # the variable for the one install whose build it asserts on.
        #
        # Before this, `bash scripts/ci-step-durations.sh` on 2026-10-13
        # (n=95) gave median 726 s, p95 855 s, max 912 s for this step
        # against its 15-minute bound, and main run 38404408273 was killed
        # at the bound with two files left. The bound is unchanged; re-run
        # the script once runs with the variable set have accumulated, and
        # revisit the bound when its max passes 450 s, half the bound.
        #
        # Bounded so a queue-starved or hung step fails as itself rather
        # than consuming the job backstop. Re-derive the current
        # distribution with `bash scripts/ci-step-durations.sh` before
        # changing this value - a prior bound here (8 minutes) was derived
        # from a single observation and gave only ~4% margin over the true
        # measured max once a full run of completed executions (n=150,
        # including failed/cancelled) was collected. 15 minutes keeps real
        # margin over that measured max while staying well inside the job
        # backstop above.
        timeout-minutes: 15
        env:
          AE_INSTALL_SKIP_BUILD: '1'
        run: |
          set -e
          # bin/tests/test_codex_hooks_resolve.sh is also run by adapter-sync.yml -
          # intentional double coverage, not an exclusion candidate.
          files=(bin/tests/test_*.sh)
          orphans=(
            tests/bootstrap-guard.test.sh
            scripts/test/repo-dir.test.sh
            .claude/tests/install-converge.test.sh
            .cursor/tests/install-converge.test.sh
          )
          for f in "${orphans[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected orphaned test file '$f' not found - it may have been renamed or moved" >&2
              exit 1
            fi
            files+=("$f")
          done
          count=0
          for f in "${files[@]}"; do
            case "$f" in
              __no_quarantined_tests_yet__)
                # QUARANTINE mechanism (precedent: DS-89 in hooks-sh-tests, see
                # hooks-tests.yml): if a test in this job proves flaky, add a case
                # arm here matching its path, `continue`, and a one-line reason
                # comment referencing the tracking ticket.
                continue
                ;;
            esac
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: discovery matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count shell bin test files"
