name: bin-tests
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
# TIMEOUT POLICY (all three jobs below).
#
# A job's `started_at` is stamped at RUNNER ASSIGNMENT, not at first-step
# execution, so a job-level `timeout-minutes` can be consumed entirely by queue
# wait. That is not hypothetical here: python-bin-tests was cancelled on this
# repo having recorded `steps: []` - no step ever ran - and bin-sh-tests was
# cancelled the same way on main (run 31115638748, sha f81b63c0). The suites
# themselves finish in well under a minute.
#
# So: job-level `timeout-minutes` is a BACKSTOP ONLY (20), and every real work
# step carries its own `timeout-minutes`, which starts when the step starts and
# is therefore immune to acquisition delay. Do not "fix" a queue-starvation
# cancellation by raising the job timeout alone - that trades a fast silent
# failure for a slow one and leaves the steps unbounded.
jobs:
  python-bin-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Keep partial output if the job is force-killed anyway.
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # pytest-timeout converts an unbounded subprocess stall anywhere in
      # bin/tests/ into ONE failing test with a stack trace at the exact call,
      # instead of a killed job with no usable log.
      - run: pip install pytest pytest-timeout pyyaml
      - name: install zsh (required for the bash/zsh parity matrix in test_phase8_telemetry_shell.py)
        # Observed 10s-152s across recent successful runs (apt mirror
        # variance); 5 minutes is real headroom over that ceiling.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y zsh
      - run: python3 -m pytest bin/tests/ -q --timeout=60 --timeout-method=thread
        timeout-minutes: 5
      - name: floor collected test_phase8_telemetry_shell.py count at 20
        # 10 test functions x 2 shells (bash, zsh) = 20 collected IDs (round
        # 12 added test_correct_block_aborts_loudly_on_defeated_negation, the
        # point-of-use defeated-negation loud-fail test). Adding or removing
        # a test function in bin/tests/test_phase8_telemetry_shell.py
        # obliges updating the floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_phase8_telemetry_shell.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 20) { print "expected >= 20 collected tests (10 functions x 2 shells), got " $1; exit 1 } }'
      - name: floor collected test_qa_knowledge_capture_shell.py count at 52
        # 18 test functions - 17 parametrized x {bash, zsh, sh} (51) plus 1
        # static, shell-independent assertion (1) = 52 collected IDs. Adding
        # or removing a test function in
        # bin/tests/test_qa_knowledge_capture_shell.py obliges updating the
        # floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_qa_knowledge_capture_shell.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 52) { print "expected >= 52 collected tests (17 functions x 3 shells + 1 static), got " $1; exit 1 } }'
      - name: floor collected test_knowledge_harness_smoke.py count at 31
        # 18 test functions - 13 parametrized x {bash, zsh} (26) plus 5 static,
        # shell-independent assertions (5) = 31 collected IDs. Adding or
        # removing a test function in
        # bin/tests/test_knowledge_harness_smoke.py obliges updating the floor
        # below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_knowledge_harness_smoke.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 31) { print "expected >= 31 collected tests (13 functions x 2 shells + 5 static), got " $1; exit 1 } }'
      - name: floor collected test_phase11e_knowledge_commit_shell.py count at 49
        # 26 test functions - 23 parametrized x {bash, zsh} (46) plus 3 static,
        # shell-independent assertions (3) = 49 collected IDs (round 12 added
        # test_defeated_negation_is_skipped_loudly_others_still_commit, the
        # point-of-use defeated-negation loud-fail test). Adding or removing
        # a test function in bin/tests/test_phase11e_knowledge_commit_shell.py
        # obliges updating the floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_phase11e_knowledge_commit_shell.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 49) { print "expected >= 49 collected tests (23 functions x 2 shells + 3 static), got " $1; exit 1 } }'
      - name: floor collected test_agent_return_contract_mutation.py count at 26
        # 21 mutation entries in MUTATIONS (one test_mutation_<id> each - 17
        # pre-round-6, 3 round-6 regression mutations (one per Major
        # finding), plus 1 round-7 regression mutation pinning the
        # SHAPE3_BARE_STATUS_TOKEN_RE permissive-widening direction) plus
        # test_no_survivors (1) plus 4 seed-baseline sanity tests
        # (test_shape1_seed_is_baseline_compliant,
        # test_shape2_seed_is_baseline_compliant,
        # test_shape4_seed_is_baseline_compliant, and
        # test_skeptic_seed_is_the_real_migrated_baseline -
        # the skeptic-baseline check IS one of these 4, not a separate 5th)
        # = 26 collected IDs. Removing an operator from MUTATIONS without
        # shrinking this floor is exactly the failure mode this gate exists
        # to catch (round-5 finding: removing one operator left the suite
        # green with `len(MUTATIONS) == 12` and nothing red). Adding or
        # removing a mutation in
        # bin/tests/test_agent_return_contract_mutation.py's MUTATIONS list
        # obliges updating the floor below in the same PR.
        timeout-minutes: 2
        run: |
          python3 -m pytest bin/tests/test_agent_return_contract_mutation.py --collect-only -q | grep -c '::test_' | awk '{ if ($1 < 26) { print "expected >= 26 collected tests (21 mutations + 1 aggregate + 4 seed-baseline, incl. skeptic baseline), got " $1; exit 1 } }'
  # Python hook tests live here (shared python toolchain with bin-tests); JS/sh
  # hook tests live in hooks-tests.yml.
  hooks-python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: run Python hook tests
        timeout-minutes: 5
        run: |
          set -e
          count=0
          for f in hooks/tests/test-*.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: glob hooks/tests/test-*.py matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count Python hook test files"
  # Discovers and runs shell-based test suites no other workflow covers: the
  # bin/tests/test_*.sh convention plus 4 orphaned *.test.sh files scattered
  # across other dirs (different naming convention, previously unwired anywhere).
  bin-sh-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - name: install zsh (required for bash/zsh parity assertion in test_check_resident_budget.sh)
        # Observed 10s-152s across recent successful runs (apt mirror
        # variance); 5 minutes is real headroom over that ceiling.
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: install gitleaks CLI (required by test_gitleaks_allowlist_scope.sh)
        # test_gitleaks_allowlist_scope.sh hard-fails under CI if gitleaks is
        # missing on PATH (a silently-skipped security regression guard is
        # indistinguishable from a passing one), so this step must always
        # succeed here. Version and checksum are read from
        # .github/workflows/gitleaks.yml at CI time rather than hardcoded, so
        # bumping that pin cannot silently drift from this install step.
        run: |
          set -euo pipefail
          version="$(grep -E '^[[:space:]]*GITLEAKS_VERSION:' .github/workflows/gitleaks.yml | head -1 | sed -E 's/^[^:]*:[[:space:]]*//')"
          sha256="$(grep -E '^[[:space:]]*GITLEAKS_SHA256:' .github/workflows/gitleaks.yml | head -1 | sed -E 's/^[^:]*:[[:space:]]*//')"
          if [ -z "$version" ] || [ -z "$sha256" ]; then
            echo "ERROR: could not read GITLEAKS_VERSION/GITLEAKS_SHA256 out of .github/workflows/gitleaks.yml" >&2
            exit 1
          fi
          tarball="gitleaks_${version}_linux_x64.tar.gz"
          url="https://github.com/gitleaks/gitleaks/releases/download/v${version}/${tarball}"
          curl -sSfL "$url" -o "$tarball"
          echo "${sha256}  ${tarball}" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version
      - name: run shell bin tests
        # This step measured 4m56s against the old 5-minute JOB timeout on a
        # single PR, and was cancelled outright on main under queue pressure.
        # 8 minutes is real headroom for the step's own runtime; queue wait no
        # longer counts against it.
        timeout-minutes: 8
        run: |
          set -e
          # bin/tests/test_codex_hooks_resolve.sh is also run by adapter-sync.yml -
          # intentional double coverage, not an exclusion candidate.
          files=(bin/tests/test_*.sh)
          orphans=(
            tests/bootstrap-guard.test.sh
            scripts/test/repo-dir.test.sh
            .claude/tests/install-converge.test.sh
            .cursor/tests/install-converge.test.sh
          )
          for f in "${orphans[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: expected orphaned test file '$f' not found - it may have been renamed or moved" >&2
              exit 1
            fi
            files+=("$f")
          done
          count=0
          for f in "${files[@]}"; do
            case "$f" in
              __no_quarantined_tests_yet__)
                # QUARANTINE mechanism (precedent: DS-89 in hooks-sh-tests, see
                # hooks-tests.yml): if a test in this job proves flaky, add a case
                # arm here matching its path, `continue`, and a one-line reason
                # comment referencing the tracking ticket.
                continue
                ;;
            esac
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: discovery matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count shell bin test files"
