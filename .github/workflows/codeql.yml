name: codeql

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Weekly on Mondays at 06:00 UTC.
    - cron: '0 6 * * 1'

permissions:
  contents: read

# Cancelling an in-progress PR run on a new push is the standard, safe case
# (a superseded push makes the old analysis moot). Cancelling a push:main or
# schedule run is riskier here: the analyze job's final step uploads SARIF
# results to the code-scanning tab, and a cancelled mid-upload run could
# leave that publish half-applied for the affected commit. The expression
# below cancels only pull_request runs; push/schedule runs still share the
# group (so an overlapping run queues instead of racing) but are never torn
# down mid-publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - python
          - actions
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'

  # Dependency-advisory gate. Lives here rather than in its own workflow
  # because this is the repo's security-analysis workflow and it ALREADY
  # carries the exact trigger set this gate needs, including the weekly
  # schedule - and the schedule is the load-bearing one. The failure this
  # gate exists for (two high-severity alerts auto-dismissed and unfixed for
  # five weeks) is a DRIFT failure: no diff introduces it, so a PR-only gate
  # would not have caught it either. A newly published advisory against an
  # unchanged lockfile surfaces on the next scheduled run.
  #
  # ADVISORY, NOT REQUIRED. Deliberately absent from the main ruleset's
  # required-checks list, following scripts/check-command-file-budget.sh and
  # scripts/check-slide-overflow.sh. Note what that precedent does NOT mean:
  # the job is NOT continue-on-error. It goes red on an actionable advisory
  # like any other check, it just does not block the merge button.
  #
  # No matrix, ubuntu-latest only. This repo has a recorded incident where a
  # matrix added to an existing job quietly made a required check
  # unsatisfiable AND burned ~12,000 macOS runner minutes (~$1000) before
  # anyone noticed. Do not add one here.
  npm-audit:
    name: npm audit (actionable advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # No `npm ci` and no cache. `npm audit` resolves the dependency tree
      # from the lockfile alone and needs no node_modules present (verified
      # on a tree with neither node_modules/ nor scripts/node_modules/), so
      # an install step here would add minutes and buy nothing.
      - name: Set up node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Audit both manifests for actionable advisories
        run: bash scripts/check-npm-audit.sh
