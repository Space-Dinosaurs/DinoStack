name: codex-skill-sync

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check-codex-skill-sync:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Check codex skill sync
        run: bash scripts/check-codex-skill-sync.sh
      - name: Run native skill generator tests
        run: python3 -m unittest scripts.test.test_codex_skills
