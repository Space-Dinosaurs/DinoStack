name: command-file-budget

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-command-file-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # DS-182: the per-PR delta axis resolves origin/main via git -
          # a default shallow checkout leaves that ref unreachable and the
          # axis would silently degrade to SKIPPED on every CI run.
          fetch-depth: 0
      - name: Run command file budget check
        # This job goes RED (fails the step, fails the job, fails the
        # check) on overage - GitHub Actions has no mechanism for a step
        # to render a neutral/yellow check, so `continue-on-error` cannot
        # produce that and previously just hid the failure behind a green
        # check with no annotation. It is advisory only in the sense that
        # it is deliberately NOT added to the `main` ruleset's
        # required-checks list yet - promotion to a blocking check is a
        # separate operator decision - not because the run itself is
        # swallowed.
        timeout-minutes: 2
        run: bash scripts/check-command-file-budget.sh
