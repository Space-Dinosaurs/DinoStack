name: copilot-skill-budget

on:
  # PR-only, and its job runs only on the non-Claude catch-up chore's branch
  # or a workflow_dispatch (see the job comment). Its post-merge counterpart
  # in verify-merged-tree.yml runs only on a workflow_dispatch with
  # all_harnesses set. Policy: .github/workflows/AGENTS.md
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Measures generated non-Claude output, which lags `content/` until the
  # on-demand catch-up chore (root AGENTS.md, "Claude Code first"), so this
  # job runs only on that chore's branch or a workflow_dispatch.
  check-copilot-skill-budget:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/adapter-catch-up') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # The informational burn line resolves origin/main via git - a
          # default shallow checkout leaves that ref unreachable and the
          # line would render its "burn: SKIPPED (...)" variant (never
          # omitted outright) on every CI run. Same rationale as the
          # sibling check-skill-embed-budget job in resident-budget.yml.
          fetch-depth: 0
      - name: Run Copilot skill budget check
        # This job goes RED (fails the step, fails the job, fails the
        # check) on overage - it is advisory only in the sense that it is
        # deliberately NOT added to the `main` ruleset's required-checks
        # list, matching check-command-file-budget.sh's precedent - not
        # because the run itself is swallowed.
        timeout-minutes: 2
        run: bash scripts/check-copilot-skill-budget.sh
