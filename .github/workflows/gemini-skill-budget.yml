name: gemini-skill-budget

on:
  # PR-only, and its job runs only on the non-Claude catch-up chore's branch
  # or a workflow_dispatch (see the job comment). Its post-merge counterpart
  # in verify-merged-tree.yml runs only on a workflow_dispatch with
  # all_harnesses set. Policy: .github/workflows/AGENTS.md
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Measures generated non-Claude output, which lags `content/` until the
  # on-demand catch-up chore (root AGENTS.md, "Claude Code first"), so this
  # job runs only on that chore's branch or a workflow_dispatch.
  check-gemini-skill-budget:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/adapter-catch-up') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # DS-184: the informational burn line resolves origin/main via
          # git - a default shallow checkout leaves that ref unreachable
          # and the line would silently degrade to its SKIPPED variant on
          # every CI run (same rationale as resident-budget.yml's
          # check-skill-embed-budget job).
          fetch-depth: 0
      - name: Run Gemini skill budget check
        # Advisory only, matching check-command-file-budget.sh's
        # precedent - deliberately NOT added to the main ruleset's
        # required-checks list (a separate operator decision). The job
        # still goes RED on overage; nothing here swallows the failure.
        run: bash scripts/check-gemini-skill-budget.sh
