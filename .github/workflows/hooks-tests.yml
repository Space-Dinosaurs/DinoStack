name: hook-tests
on:
  pull_request:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  wrap-lock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: wrap-lock acquire test
        run: node hooks/tests/test-wrap-acquire-lock.js
      - name: wrap-lock release test
        run: node hooks/tests/test-wrap-release-lock.js
  hooks-js-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: run JS hook tests
        run: |
          set -e
          count=0
          for f in hooks/tests/test-*.js; do
            case "$f" in
              hooks/tests/test-wrap-acquire-lock.js|hooks/tests/test-wrap-release-lock.js)
                # QUARANTINE/exclusion mechanism: these two run in the wrap-lock-tests job
                # above - they are NOT orphaned. If the wrap-lock-tests job is ever removed,
                # DELETE these case arms so the files fall back into this loop; otherwise
                # they would silently run in no job at all. To quarantine a file, add a
                # case arm here with a one-line reason comment.
                continue
                ;;
            esac
            echo "::group::$f"
            node "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: glob hooks/tests/test-*.js matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count JS hook test files (excludes the 2 covered by the wrap-lock-tests job)"
  hooks-sh-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: run shell hook tests
        run: |
          set -e
          count=0
          for f in hooks/tests/test-*.sh; do
            case "$f" in
              hooks/tests/test-version-check-core-repo-dir.sh)
                # QUARANTINED (DS-89): case c2 "lib-missing inline fallback end-to-end" is
                # flaky - fails ~1 in 4 runs on a clean origin/main baseline (pre-existing,
                # not a DS-88 regression). Re-enable by deleting this arm once DS-89 lands.
                continue
                ;;
            esac
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: glob hooks/tests/test-*.sh matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count shell hook test files (excludes 1 quarantined pending DS-89)"
