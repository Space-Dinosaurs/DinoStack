name: kimi-skill-budget

on:
  # PR-only. The post-merge run is not deleted, it is consolidated into
  # verify-merged-tree.yml, which re-runs this check on `main` only when an
  # `--admin` merge bypassed the ruleset's up-to-date requirement and landed
  # a tree no PR run tested. Measurement, policy and retirement (the only
  # site carrying the figures): .github/workflows/AGENTS.md
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Measures generated non-Claude output, which lags `content/` until the
  # on-demand catch-up chore (root AGENTS.md, "Claude Code first"), so this
  # job runs only on that chore's branch or a workflow_dispatch.
  check-kimi-skill-embed-budget:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/adapter-catch-up') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # DS-185: the informational burn lines resolve origin/main via
          # git - a default shallow checkout leaves that ref unreachable
          # and both lines would render their "burn: SKIPPED (...)"
          # variant on every CI run.
          fetch-depth: 0
      - name: Run Kimi skill embed budget check
        run: bash scripts/check-kimi-skill-embed-budget.sh
