name: resident-budget

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-resident-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run resident budget check
        run: bash scripts/check-resident-budget.sh

  check-skill-embed-budget:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # DS-182: the informational burn line resolves origin/main via
          # git - a default shallow checkout leaves that ref unreachable
          # and the line would render its "burn: SKIPPED (base
          # unresolvable)" variant (never omitted outright) on every CI
          # run.
          fetch-depth: 0
      - name: Run skill embed budget check
        run: bash scripts/check-skill-embed-budget.sh
