name: scorecard

on:
  push:
    branches:
      - main
  schedule:
    # Weekly on Saturdays at 01:30 UTC.
    - cron: '30 1 * * 6'

# No cancel-in-progress: this job calls publish_results: true, which
# publishes the analysis to the OpenSSF Scorecard API. Cancelling a run
# mid-publish could leave a partial or inconsistent published result. The
# group still serializes overlapping runs (a push landing during the weekly
# schedule run queues instead of racing) without tearing one down mid-write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      security-events: write
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # OpenSSF Scorecard's publish_results API only accepts an approved step
      # list and forbids workflow-level write permissions; do not add
      # non-allowlisted steps or broaden permissions or publish_results breaks.
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: results.sarif
