                continue
                ;;
            esac
            echo "::group::$f"
            bash "$f"
            echo "::endgroup::"
            count=$((count+1))
          done
          if [ "$count" -eq 0 ]; then
            echo "ERROR: glob hooks/tests/test-*.sh matched zero runnable files - discovery is broken, not clean" >&2
            exit 1
          fi
          echo "Ran $count shell hook test files (excludes 1 quarantined pending DS-89)"
