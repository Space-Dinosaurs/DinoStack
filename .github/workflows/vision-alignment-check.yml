name: vision-alignment-check
on:
  # `edited` is required: this check reads the PR BODY, and a body-only edit
  # fires no synchronize event. Without it, adding the section to an already-open
  # PR leaves the red permanently until an unrelated push. In-repo precedent:
  # pr-review-rigor.yml, which reads the body for the same reason.
  pull_request:
    types: [opened, edited, synchronize, reopened]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  check-vision-alignment:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - name: Check North Star alignment section on methodology-affecting PRs
        id: alignment-check
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"
          FILES="$(gh pr view "$PR_NUMBER" --json files -q '.files[].path')"
          TRIGGERED=false
          # Keep this case pattern in sync with the canonical trigger list in
          # content/agents/skeptic.md step 3.6. Do not edit this list without
          # also updating that file and the PR-template comment.
          while IFS= read -r f; do
            case "$f" in
              content/*|hooks/*|.codex/hooks/*|.codex/skill-frontmatter/*|.codex/skill-compatibility.yml|.codex/skills/*|scripts/codex-skills.py|.codex/config/hooks.json|.gemini/hooks/*|.kimi/hooks/*|.claude/build.sh|.codex/build.sh|.cursor/build.sh|bin/*|*/install.sh|scripts/install*.sh|docs/overview/vision.md|docs/overview/requirements.md)
                TRIGGERED=true
                ;;
            esac
          done <<< "$FILES"

          echo "triggered=$TRIGGERED" >> "$GITHUB_OUTPUT"

          if [ "$TRIGGERED" != "true" ]; then
            echo "OK: no methodology-affecting paths changed - vision-alignment section not required."
            exit 0
          fi

          # gh pr view --json body returns an empty string (not an error) when the PR body is
          # blank. printf/awk/sed on an empty or single-newline input exit 0 with empty output -
          # the awk pipeline itself never fails; the explicit exit 1 below is our own check,
          # not a side effect of an empty pipeline. A read-only GITHUB_TOKEN on a fork PR can
          # still read this public repo's PR files and body - no elevated token needed.
          BODY="$(gh pr view "$PR_NUMBER" --json body -q '.body')"
          SECTION="$(printf '%s\n' "$BODY" | awk '/## North Star alignment/{flag=1; next} /^## /{flag=0} flag')"
          # Reduce the section to its ANSWERS before testing for emptiness. Presence alone is
          # not an answer: a body still carrying "[pillar]" verbatim, or carrying only the
          # template's own bullet labels, satisfies a bare presence test while answering
          # nothing - which would make this check vacuous exactly where it used to be
          # unmissably red. Three reductions, in order:
          #   1. HTML comments, single-line AND multi-line. Both passes are needed and the
          #      ORDER is load-bearing. The template ships its instructions as a MULTI-LINE
          #      comment, which a line-based s/<!--.*-->//g does not touch at all - fed the
          #      unfilled template verbatim, the surviving comment text became the "answer"
          #      and the check passed. The range delete alone is also wrong: a range whose
          #      start and end match on the SAME line does not end there (sed resumes looking
          #      from the next line), so a trailing inline comment on a filled answer would
          #      swallow the rest of the section and fail a good body. So: close single-line
          #      comments first, then delete what genuinely spans lines.
          #   2. On a bullet line, the label up to its first colon - scaffolding, not content.
          #      Generic rather than an enumeration of the two current labels, so a reworded
          #      template does not silently reopen the hole. A bare line (e.g. "N/A - ...")
          #      has no leading "- <label>:" and survives untouched.
          #   3. The literal placeholder tokens Phase 9 emits.
          # What remains is what the author actually wrote. Empty => not filled in.
          # Disclosed residual: this is a presence check, so a punctuation-only answer
          # ("- Pillar(s) ...: .") still passes - deliberate evasion is out of its reach.
          STRIPPED="$(printf '%s\n' "$SECTION" \
            | sed -e 's/<!--.*-->//g' -e '/<!--/,/-->/d' \
            | sed 's/^[[:space:]]*-[^:]*:/ /' \
            | sed -e 's/\[pillar\]//g' -e 's/\[trade-off, or "none identified"\]//g' \
            | tr -d '[:space:]')"

          if [ -z "$STRIPPED" ]; then
            echo "::error::This PR changes methodology-shaping paths but its '## North Star alignment' section is missing, empty, or still holds the [pillar]/[trade-off] placeholders. Fill it per .github/PULL_REQUEST_TEMPLATE.md - a one-line N/A is fine when no methodology-shaping path is touched. Editing the body re-runs this check; no push needed."
            exit 1
          fi

          echo "OK: North Star alignment section present."
      - name: Reminder - route methodology-shaping work through /ds-update-agentic-engineering
        if: always() && steps.alignment-check.outputs.triggered == 'true'
        run: |
          echo "::notice::This PR touches methodology-shaping paths. If this work was ad hoc rather than ticket-driven, confirm it was routed through /ds-update-agentic-engineering (git-sync, vision-alignment review, explicit human approval before commit). Ticket-driven work is expected to satisfy the vision-alignment portion of this via the Skeptic's step 3.6 instead. This notice is informational only and cannot verify which path was actually taken."
