# Provider tier maps for cost-aware routing - Codex and Gemini only.
#
# THIS FILE IS AN ILLUSTRATIVE EXAMPLE. It is NOT installed, copied, or
# consulted at runtime. Nothing in this repo reads this file. It is here
# purely as a reference for users who want to author their own tier map.
#
# To enable tier routing:
#   1. Copy this file to ~/.agentic/tier-map.yml (or .agentic/tier-map.yml
#      in a project root for project-specific overrides).
#   2. Replace each placeholder below with a real model id from your
#      provider's current catalog. This file intentionally uses
#      placeholders instead of concrete model ids so it never goes stale
#      as providers release and retire models - edit to suit your needs.
#   3. Restart the session. No rebuild needed.
#
# If no tier map exists when a Codex/Gemini agent is spawned, the conductor
# omits the --model flag and the CLI uses its session default. There are
# no hardcoded fallback model IDs anywhere in the repo or adapters - this
# is deliberate so provider releases never require repo edits.
#
# Claude Code uses a built-in enum (haiku/sonnet/opus); no tier-map lookup
# is needed for Claude and this file is irrelevant to Claude spawns.
#
# Tier 1 = cheap/fast, Tier 2 = balanced, Tier 3 = max capability.

codex:
  tiers:
    1: <cheap-fast-model-id>      # tier 1, replace with a real model id
    2: <balanced-model-id>        # tier 2, replace with a real model id
    3: <max-capability-model-id>  # tier 3, replace with a real model id

gemini:
  tiers:
    1: <cheap-fast-model-id>      # tier 1, replace with a real model id
    2: <balanced-model-id>        # tier 2, replace with a real model id
    3: <max-capability-model-id>  # tier 3, replace with a real model id
