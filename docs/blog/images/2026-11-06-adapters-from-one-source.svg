<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 680" width="600" height="680" role="img" aria-labelledby="t d">
  <title id="t">One content directory, eleven adapters</title>
  <desc id="d">The methodology, agents and commands live once in content/. Each adapter directory has its own build.sh and install.sh that turn that source into one tool's format. The eleven tools are Claude Code, Cursor, Codex CLI, Gemini CLI, Kimi Code CLI, OpenCode, Pi coding agent, Pi (oh-my-pi), Hermes Agent, OpenClaw and VS Code Copilot. Claude Code is the primary harness.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9bb0cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="680" rx="16" fill="#02050C"/>
  <g font-family="'Nunito Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="300" y="46" font-size="22" font-weight="700" fill="#ffffff">One source, eleven tools</text>

    <rect x="110" y="70" width="380" height="90" rx="12" fill="#0A1020" stroke="#b06bff" stroke-width="2"/>
    <text x="300" y="108" font-size="22" font-weight="700" fill="#b06bff">content/</text>
    <text x="300" y="140" font-size="18" fill="#9bb0cc">methodology, agents, commands</text>
    <line x1="300" y1="160" x2="300" y2="196" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="300" y="222" font-size="17" fill="#9bb0cc">each adapter: build.sh, install.sh</text>

    <rect x="30" y="242" width="255" height="50" rx="10" fill="#060B16" stroke="#18E0FF" stroke-width="2.5"/>
    <text x="157" y="274" font-size="19" font-weight="700" fill="#18E0FF">Claude Code</text>
    <rect x="315" y="242" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="442" y="274" font-size="19" fill="#eaf1fb">Cursor</text>

    <rect x="30" y="304" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="157" y="336" font-size="19" fill="#eaf1fb">Codex CLI</text>
    <rect x="315" y="304" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="442" y="336" font-size="19" fill="#eaf1fb">Gemini CLI</text>

    <rect x="30" y="366" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="157" y="398" font-size="19" fill="#eaf1fb">Kimi Code CLI</text>
    <rect x="315" y="366" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="442" y="398" font-size="19" fill="#eaf1fb">OpenCode</text>

    <rect x="30" y="428" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="157" y="460" font-size="19" fill="#eaf1fb">Pi coding agent</text>
    <rect x="315" y="428" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="442" y="460" font-size="19" fill="#eaf1fb">Pi (oh-my-pi)</text>

    <rect x="30" y="490" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="157" y="522" font-size="19" fill="#eaf1fb">Hermes Agent</text>
    <rect x="315" y="490" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="442" y="522" font-size="19" fill="#eaf1fb">OpenClaw</text>

    <rect x="30" y="552" width="255" height="50" rx="10" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="157" y="584" font-size="19" fill="#eaf1fb">VS Code Copilot</text>

    <text x="300" y="646" font-size="19" fill="#18E0FF">Claude Code is the primary harness</text>
  </g>
</svg>
