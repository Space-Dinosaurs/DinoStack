<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900" role="img" aria-labelledby="t d">
  <title id="t">DinoStack conductor and ds-lane architecture</title>
  <desc id="d">The operator talks to one conductor session. The conductor starts up to 5 ds-lane sessions by default, each a headless claude -p or codex exec session running /ds-implement-ticket: an engineer in an isolated worktree, then a Skeptic review loop, then QA, then a PR. Rulings flow from the conductor to the lanes, and only decisions flow back to the operator. Lanes never message each other.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9bb0cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="600" height="900" rx="16" fill="#02050C"/>
  <g font-family="'Nunito Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="190" y="24" width="220" height="64" rx="10" fill="#0A1020" stroke="#E9B521" stroke-width="2"/>
    <text x="300" y="64" font-size="24" font-weight="700" fill="#ffffff">Operator</text>

    <line x1="270" y1="92" x2="270" y2="152" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <line x1="330" y1="152" x2="330" y2="92" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="256" y="128" font-size="18" fill="#eaf1fb" text-anchor="end">rulings</text>
    <text x="344" y="128" font-size="18" fill="#eaf1fb" text-anchor="start">decisions only</text>

    <rect x="110" y="156" width="380" height="84" rx="10" fill="#0A1020" stroke="#18E0FF" stroke-width="2"/>
    <text x="300" y="192" font-size="24" font-weight="700" fill="#ffffff">Conductor</text>
    <text x="300" y="222" font-size="18" fill="#9bb0cc">one session, does no ticket work itself</text>

    <line x1="300" y1="244" x2="300" y2="302" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="314" y="280" font-size="18" fill="#eaf1fb" text-anchor="start">rulings down, decisions up</text>

    <rect x="64" y="322" width="512" height="460" rx="12" fill="#060B16" stroke="#b06bff" stroke-width="2" stroke-dasharray="7 5" opacity="0.6"/>
    <rect x="44" y="314" width="512" height="460" rx="12" fill="#060B16" stroke="#b06bff" stroke-width="2" stroke-dasharray="7 5" opacity="0.8"/>
    <rect x="24" y="306" width="512" height="460" rx="12" fill="#060B16" stroke="#b06bff" stroke-width="2"/>
    <text x="280" y="342" font-size="22" font-weight="700" fill="#ffffff">ds-lane 1 ... N</text>
    <text x="280" y="370" font-size="18" fill="#9bb0cc">up to 5 at once by default</text>
    <text x="280" y="396" font-size="18" fill="#9bb0cc">headless claude -p or codex exec</text>
    <text x="280" y="422" font-size="18" fill="#9bb0cc">running /ds-implement-ticket</text>

    <rect x="80" y="442" width="400" height="58" rx="8" fill="#0D1426" stroke="#3ad99a" stroke-width="2"/>
    <text x="280" y="478" font-size="20" fill="#eaf1fb">Engineer in a worktree</text>
    <line x1="280" y1="500" x2="280" y2="518" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="80" y="522" width="400" height="58" rx="8" fill="#0D1426" stroke="#ff5d73" stroke-width="2"/>
    <text x="280" y="558" font-size="20" fill="#eaf1fb">Skeptic review loop</text>
    <line x1="280" y1="580" x2="280" y2="598" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="80" y="602" width="400" height="58" rx="8" fill="#0D1426" stroke="#E9B521" stroke-width="2"/>
    <text x="280" y="638" font-size="20" fill="#eaf1fb">QA</text>
    <line x1="280" y1="660" x2="280" y2="678" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <rect x="80" y="682" width="400" height="58" rx="8" fill="#0D1426" stroke="#18E0FF" stroke-width="2"/>
    <text x="280" y="718" font-size="20" fill="#eaf1fb">PR</text>

    <text x="300" y="830" font-size="18" fill="#9bb0cc">Lanes never message each other:</text>
    <text x="300" y="858" font-size="18" fill="#9bb0cc">every message goes through the conductor.</text>
  </g>
</svg>
