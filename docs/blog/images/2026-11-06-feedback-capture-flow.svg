<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">DinoStack feedback capture flow</title>
  <desc id="d">Four session friction signals (repeated tool failures, a stalled Skeptic review loop, a guardrail firing, and operator corrections) feed /ds-wrap Part D.5, which drafts reports with a title, body, evidence and severity. Drafts are saved to ~/.agentic/feedback.jsonl. A human reviews each batch in /ds-feedback-triage, and only greenlit items become tickets in your own tracker.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9bb0cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="440" rx="16" fill="#02050C"/>
  <g font-family="'Nunito Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="130" y="44" font-size="15" font-weight="700" fill="#ffffff">Session friction</text>
    <rect x="30" y="62" width="200" height="56" rx="8" fill="#0D1426" stroke="#ff5d73" stroke-width="1.5"/>
    <text x="130" y="88" font-size="14" fill="#eaf1fb">Repeated tool</text>
    <text x="130" y="106" font-size="14" fill="#eaf1fb">failures</text>
    <rect x="30" y="134" width="200" height="56" rx="8" fill="#0D1426" stroke="#ff5d73" stroke-width="1.5"/>
    <text x="130" y="160" font-size="14" fill="#eaf1fb">Stalled Skeptic</text>
    <text x="130" y="178" font-size="14" fill="#eaf1fb">review loop</text>
    <rect x="30" y="206" width="200" height="56" rx="8" fill="#0D1426" stroke="#ff5d73" stroke-width="1.5"/>
    <text x="130" y="232" font-size="14" fill="#eaf1fb">A guardrail</text>
    <text x="130" y="250" font-size="14" fill="#eaf1fb">firing</text>
    <rect x="30" y="278" width="200" height="56" rx="8" fill="#0D1426" stroke="#ff5d73" stroke-width="1.5"/>
    <text x="130" y="304" font-size="14" fill="#eaf1fb">Operator</text>
    <text x="130" y="322" font-size="14" fill="#eaf1fb">corrections</text>

    <path d="M232,90 L262,90 L262,198" fill="none" stroke="#9bb0cc" stroke-width="2"/>
    <path d="M232,162 L262,162" fill="none" stroke="#9bb0cc" stroke-width="2"/>
    <path d="M232,234 L262,234" fill="none" stroke="#9bb0cc" stroke-width="2"/>
    <path d="M232,306 L262,306 L262,198" fill="none" stroke="#9bb0cc" stroke-width="2"/>
    <line x1="262" y1="198" x2="286" y2="198" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="290" y="150" width="170" height="96" rx="10" fill="#0A1020" stroke="#18E0FF" stroke-width="2"/>
    <text x="375" y="180" font-size="16" font-weight="700" fill="#ffffff">/ds-wrap</text>
    <text x="375" y="202" font-size="13" fill="#9bb0cc">drafts reports:</text>
    <text x="375" y="220" font-size="13" fill="#9bb0cc">title, body,</text>
    <text x="375" y="236" font-size="13" fill="#9bb0cc">evidence, severity</text>

    <line x1="462" y1="198" x2="486" y2="198" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="490" y="150" width="170" height="96" rx="10" fill="#0A1020" stroke="#b06bff" stroke-width="2"/>
    <text x="575" y="184" font-size="16" font-weight="700" fill="#ffffff">Saved locally</text>
    <text x="575" y="210" font-size="12" fill="#9bb0cc">~/.agentic/</text>
    <text x="575" y="228" font-size="12" fill="#9bb0cc">feedback.jsonl</text>

    <line x1="662" y1="198" x2="686" y2="198" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="690" y="150" width="240" height="96" rx="10" fill="#0A1020" stroke="#E9B521" stroke-width="2"/>
    <text x="810" y="180" font-size="16" font-weight="700" fill="#ffffff">/ds-feedback-triage</text>
    <text x="810" y="204" font-size="13" fill="#9bb0cc">a human greenlights</text>
    <text x="810" y="222" font-size="13" fill="#9bb0cc">items from each batch</text>

    <line x1="810" y1="248" x2="810" y2="300" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>
    <text x="822" y="280" font-size="13" fill="#eaf1fb" text-anchor="start">greenlit only</text>

    <rect x="690" y="304" width="240" height="64" rx="10" fill="#0A1020" stroke="#3ad99a" stroke-width="2"/>
    <text x="810" y="332" font-size="16" font-weight="700" fill="#ffffff">Ticket in your</text>
    <text x="810" y="354" font-size="16" font-weight="700" fill="#ffffff">own tracker</text>

    <text x="480" y="414" font-size="13" fill="#9bb0cc">Nothing becomes a ticket until a human approves it.</text>
  </g>
</svg>
