<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500" role="img" aria-labelledby="t d">
  <title id="t">Public release dates of agent-drafted feedback reports</title>
  <desc id="d">Public release dates: 2026-07-02, DinoStack wrap-time feedback capture, PR 408. 2026-08-20, Claude Code v2.1.238, the minimum version Claude Code's docs give for Claude-drafted feedback. 2026-08-26, Claude Code v2.1.247, the release whose changelog entry adds the SendFeedback tool, 55 days after 2026-07-02.</desc>
  <rect x="0" y="0" width="600" height="500" rx="16" fill="#02050C"/>
  <g font-family="'Nunito Sans', Helvetica, Arial, sans-serif" text-anchor="start">
    <text x="300" y="48" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Public release dates</text>
    <line x1="70" y1="96" x2="70" y2="430" stroke="#9bb0cc" stroke-width="3"/>

    <circle cx="70" cy="110" r="12" fill="#18E0FF"/>
    <text x="104" y="106" font-size="22" font-weight="700" fill="#ffffff">2026-07-02</text>
    <text x="104" y="134" font-size="19" fill="#eaf1fb">DinoStack wrap-time feedback capture</text>
    <text x="104" y="160" font-size="19" fill="#9bb0cc">PR #408</text>

    <circle cx="70" cy="270" r="12" fill="#E9B521"/>
    <text x="104" y="266" font-size="22" font-weight="700" fill="#ffffff">2026-08-20</text>
    <text x="104" y="294" font-size="19" fill="#eaf1fb">Claude Code v2.1.238:</text>
    <text x="104" y="320" font-size="19" fill="#9bb0cc">minimum version in the docs</text>

    <circle cx="70" cy="390" r="12" fill="#E9B521"/>
    <text x="104" y="386" font-size="22" font-weight="700" fill="#ffffff">2026-08-26</text>
    <text x="104" y="414" font-size="19" fill="#eaf1fb">Claude Code v2.1.247:</text>
    <text x="104" y="440" font-size="19" fill="#9bb0cc">changelog adds SendFeedback</text>
    <text x="104" y="476" font-size="19" fill="#eaf1fb">55 days after 2026-07-02</text>
  </g>
</svg>
