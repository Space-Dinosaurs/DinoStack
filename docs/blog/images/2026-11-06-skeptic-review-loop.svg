<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t d">
  <title id="t">The Skeptic review loop</title>
  <desc id="d">A Worker implements. The conductor spawns a fresh Skeptic that receives only the adversarial brief, the Worker's output, and the resolved-issues list, never the Worker's reasoning. If no Critical or Major finding is open, sign-off is granted. Otherwise a new Worker fixes the findings and a new fresh Skeptic reviews again. The default cap is 3 rounds per unit; at the cap the conductor ships with the open non-Critical findings recorded as debt, or escalates to the human. An open Critical never ships. Only an operator grant reopens the loop past the cap.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9bb0cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="960" height="520" rx="16" fill="#02050C"/>
  <g font-family="'Nunito Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
    <rect x="40" y="60" width="200" height="72" rx="10" fill="#0A1020" stroke="#3ad99a" stroke-width="2"/>
    <text x="140" y="92" font-size="17" font-weight="700" fill="#ffffff">Worker</text>
    <text x="140" y="114" font-size="13" fill="#9bb0cc">implements</text>

    <line x1="242" y1="96" x2="306" y2="96" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>
    <text x="274" y="86" font-size="12" fill="#eaf1fb">output</text>

    <rect x="310" y="40" width="300" height="112" rx="10" fill="#0A1020" stroke="#ff5d73" stroke-width="2"/>
    <text x="460" y="70" font-size="17" font-weight="700" fill="#ffffff">Fresh Skeptic</text>
    <text x="460" y="94" font-size="13" fill="#9bb0cc">sees: adversarial brief, Worker output,</text>
    <text x="460" y="112" font-size="13" fill="#9bb0cc">resolved-issues list</text>
    <text x="460" y="136" font-size="13" fill="#ff5d73">never the Worker's reasoning</text>

    <line x1="612" y1="96" x2="676" y2="96" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>

    <rect x="680" y="52" width="240" height="88" rx="10" fill="#0A1020" stroke="#18E0FF" stroke-width="2"/>
    <text x="800" y="84" font-size="15" font-weight="700" fill="#ffffff">Critical or Major</text>
    <text x="800" y="104" font-size="15" font-weight="700" fill="#ffffff">still open?</text>
    <text x="800" y="126" font-size="13" fill="#9bb0cc">no: sign-off granted</text>

    <path d="M800,142 L800,214" fill="none" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>
    <text x="812" y="184" font-size="13" fill="#eaf1fb" text-anchor="start">yes</text>

    <rect x="680" y="218" width="240" height="72" rx="10" fill="#0A1020" stroke="#3ad99a" stroke-width="2"/>
    <text x="800" y="248" font-size="16" font-weight="700" fill="#ffffff">New Worker</text>
    <text x="800" y="270" font-size="13" fill="#9bb0cc">fixes the findings</text>

    <path d="M678,254 L460,254 L460,156" fill="none" stroke="#9bb0cc" stroke-width="2" marker-end="url(#ah)"/>
    <text x="570" y="244" font-size="13" fill="#eaf1fb">a NEW fresh Skeptic, next round</text>

    <rect x="160" y="340" width="640" height="140" rx="12" fill="#060B16" stroke="#E9B521" stroke-width="2"/>
    <text x="480" y="372" font-size="17" font-weight="700" fill="#ffffff">Round cap: 3 rounds per unit by default</text>
    <text x="480" y="400" font-size="14" fill="#eaf1fb">At the cap: ship with open non-Critical findings recorded as debt, or escalate to the human</text>
    <text x="480" y="426" font-size="14" fill="#ff5d73">An open Critical never ships</text>
    <text x="480" y="456" font-size="14" fill="#eaf1fb">Only an operator grant reopens the loop past the cap</text>

    <path d="M800,292 L800,316 L480,316 L480,336" fill="none" stroke="#9bb0cc" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ah)"/>
  </g>
</svg>
