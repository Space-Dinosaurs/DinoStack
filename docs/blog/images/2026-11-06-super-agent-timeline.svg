<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 560" width="600" height="560" role="img" aria-labelledby="t d">
  <title id="t">Public release dates of router-plus-workers designs</title>
  <desc id="d">Public release dates: 2026-09-29, DinoStack cross-session conductor, PR 954. 2026-10-12, DinoStack ds-lane, PR 994. 2026-10-31, DeepSeek publishes dsh-superagent-prototype, adapted from an internal version. 2026-11-05, AI LABS rebuilds it in Claude Code.</desc>
  <rect x="0" y="0" width="600" height="560" rx="16" fill="#02050C"/>
  <g font-family="'Nunito Sans', Helvetica, Arial, sans-serif" text-anchor="start">
    <text x="300" y="48" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">Public release dates</text>
    <line x1="70" y1="90" x2="70" y2="520" stroke="#9bb0cc" stroke-width="3"/>

    <circle cx="70" cy="110" r="12" fill="#18E0FF"/>
    <text x="104" y="106" font-size="22" font-weight="700" fill="#ffffff">2026-09-29</text>
    <text x="104" y="134" font-size="19" fill="#eaf1fb">DinoStack cross-session conductor (PR #954)</text>

    <circle cx="70" cy="220" r="12" fill="#18E0FF"/>
    <text x="104" y="216" font-size="22" font-weight="700" fill="#ffffff">2026-10-12</text>
    <text x="104" y="244" font-size="19" fill="#eaf1fb">DinoStack ds-lane (PR #994)</text>

    <circle cx="70" cy="330" r="12" fill="#E9B521"/>
    <text x="104" y="326" font-size="22" font-weight="700" fill="#ffffff">2026-10-31</text>
    <text x="104" y="354" font-size="19" fill="#eaf1fb">DeepSeek publishes dsh-superagent-prototype,</text>
    <text x="104" y="380" font-size="19" fill="#eaf1fb">adapted from an internal version</text>

    <circle cx="70" cy="460" r="12" fill="#E9B521"/>
    <text x="104" y="456" font-size="22" font-weight="700" fill="#ffffff">2026-11-05</text>
    <text x="104" y="484" font-size="19" fill="#eaf1fb">AI LABS rebuilds it in Claude Code</text>
  </g>
</svg>
