<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 660" width="700" height="660" role="img" aria-labelledby="t d">
  <title id="t">DinoStack's governance layer set against the field</title>
  <desc id="d">Left: DinoStack's governance layer, made of a risk tier per change, Skeptic review on Elevated work, QA and quality gates, and a conductor with parallel lanes. It runs as markdown on the host harness through 11 harness adapters, among them Claude Code, Codex and Pi, with a model tier set per agent. Right: the field compared on this page, namely ICM / MWP, GSD, Ponytail, ECC, Prime Agent and Letta.</desc>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9bb0cc"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="700" height="660" rx="16" fill="#02050C"/>
  <g font-family="'Nunito Sans', Helvetica, Arial, sans-serif" text-anchor="middle">
    <text x="232" y="44" font-size="26" font-weight="700" fill="#ffffff">DinoStack</text>
    <text x="572" y="44" font-size="26" font-weight="700" fill="#ffffff">The field</text>

    <rect x="20" y="64" width="424" height="310" rx="12" fill="#0A1020" stroke="#18E0FF" stroke-width="2"/>
    <text x="232" y="100" font-size="22" font-weight="700" fill="#ffffff">Governance layer</text>
    <rect x="40" y="120" width="384" height="52" rx="8" fill="#0D1426" stroke="#3ad99a" stroke-width="2"/>
    <text x="232" y="153" font-size="20" fill="#eaf1fb">Risk tier per change</text>
    <rect x="40" y="182" width="384" height="52" rx="8" fill="#0D1426" stroke="#ff5d73" stroke-width="2"/>
    <text x="232" y="215" font-size="20" fill="#eaf1fb">Skeptic review on Elevated</text>
    <rect x="40" y="244" width="384" height="52" rx="8" fill="#0D1426" stroke="#E9B521" stroke-width="2"/>
    <text x="232" y="277" font-size="20" fill="#eaf1fb">QA and quality gates</text>
    <rect x="40" y="306" width="384" height="52" rx="8" fill="#0D1426" stroke="#b06bff" stroke-width="2"/>
    <text x="232" y="339" font-size="20" fill="#eaf1fb">Conductor and parallel lanes</text>

    <line x1="232" y1="378" x2="232" y2="410" stroke="#9bb0cc" stroke-width="2.5" marker-end="url(#ah)"/>
    <text x="246" y="400" font-size="18" fill="#9bb0cc" text-anchor="start">on the host harness</text>

    <rect x="20" y="414" width="424" height="150" rx="12" fill="#060B16" stroke="#9bb0cc" stroke-width="2"/>
    <text x="232" y="446" font-size="22" font-weight="700" fill="#ffffff">11 harness adapters</text>
    <rect x="40" y="462" width="186" height="44" rx="8" fill="#0D1426" stroke="#18E0FF" stroke-width="1.5"/>
    <text x="133" y="490" font-size="19" fill="#eaf1fb">Claude Code</text>
    <rect x="238" y="462" width="186" height="44" rx="8" fill="#0D1426" stroke="#18E0FF" stroke-width="1.5"/>
    <text x="331" y="490" font-size="19" fill="#eaf1fb">Codex</text>
    <rect x="40" y="514" width="186" height="44" rx="8" fill="#0D1426" stroke="#18E0FF" stroke-width="1.5"/>
    <text x="133" y="542" font-size="19" fill="#eaf1fb">Pi</text>
    <rect x="238" y="514" width="186" height="44" rx="8" fill="#0D1426" stroke="#18E0FF" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="331" y="542" font-size="19" fill="#9bb0cc">+ 8 more</text>

    <rect x="20" y="580" width="424" height="60" rx="12" fill="#060B16" stroke="#6a7c97" stroke-width="2"/>
    <text x="232" y="617" font-size="20" fill="#eaf1fb">Model tier set per agent</text>

    <rect x="464" y="64" width="216" height="576" rx="12" fill="#060B16" stroke="#6a7c97" stroke-width="2" stroke-dasharray="7 5"/>
    <text x="572" y="112" font-size="21" font-weight="700" fill="#ffffff">ICM / MWP</text>
    <text x="572" y="138" font-size="18" fill="#9bb0cc">single-agent</text>
    <line x1="484" y1="160" x2="660" y2="160" stroke="#6a7c97" stroke-width="1" opacity="0.6"/>
    <text x="572" y="200" font-size="21" font-weight="700" fill="#ffffff">GSD</text>
    <text x="572" y="226" font-size="18" fill="#9bb0cc">solo, spec-driven</text>
    <line x1="484" y1="248" x2="660" y2="248" stroke="#6a7c97" stroke-width="1" opacity="0.6"/>
    <text x="572" y="288" font-size="21" font-weight="700" fill="#ffffff">Ponytail</text>
    <text x="572" y="314" font-size="18" fill="#9bb0cc">ruleset plugin</text>
    <line x1="484" y1="336" x2="660" y2="336" stroke="#6a7c97" stroke-width="1" opacity="0.6"/>
    <text x="572" y="376" font-size="21" font-weight="700" fill="#ffffff">ECC</text>
    <text x="572" y="402" font-size="18" fill="#9bb0cc">harness toolkit</text>
    <line x1="484" y1="424" x2="660" y2="424" stroke="#6a7c97" stroke-width="1" opacity="0.6"/>
    <text x="572" y="464" font-size="21" font-weight="700" fill="#ffffff">Prime Agent</text>
    <text x="572" y="490" font-size="18" fill="#9bb0cc">a harness</text>
    <line x1="484" y1="512" x2="660" y2="512" stroke="#6a7c97" stroke-width="1" opacity="0.6"/>
    <text x="572" y="552" font-size="21" font-weight="700" fill="#ffffff">Letta</text>
    <text x="572" y="578" font-size="18" fill="#9bb0cc">agent runtime</text>
  </g>
</svg>
